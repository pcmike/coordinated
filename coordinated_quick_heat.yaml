# ==============================================================================
# COORDINATED QUICK HEAT PACKAGE
# ==============================================================================
#
# Optional add-on for Coordinated Cooler Control that provides a manual "Quick
# Heat" button for rare cold weather situations.
#
# FEATURES:
#   - One-button toggle: Heat @ 78°F or Off
#   - Smart humidity handling: When Quick Heat is active, only standalone
#     dehumidifier runs (AC won't override your heat setting)
#   - Auto-recovery: When Quick Heat turns off or humidity clears, normal
#     coordinated control resumes
#
# INSTALLATION:
#   1. Copy this file to your Home Assistant packages directory
#   2. Add to configuration.yaml:
#      homeassistant:
#        packages:
#          coordinated_quick_heat: !include packages/coordinated_quick_heat.yaml
#   3. **IMPORTANT**: Update the climate entity below to match YOUR thermostat
#   4. Restart Home Assistant
#   5. Add the Mushroom card to your dashboard (see README)
#
# ==============================================================================

# ==============================================================================
# CONFIGURATION - Update this to match YOUR setup
# ==============================================================================
# IMPORTANT: Update these settings to match your thermostat
#
# climate_entity: Change this to your physical thermostat entity
#   - Also update line 127 (template condition)
#
# heat_target: Change this to your desired heat temperature (default 80°F)
#   - Also update line 107 (generic thermostat calculation)
#   - Also update line 118 (log message calculation)
#   - Search for "80" in this file to find all instances
#
# Note: YAML anchors (*climate_entity, *heat_target) work in most places,
# but Jinja templates in strings require hardcoded values.

homeassistant:
  customize:
    package.node_anchors:
      # Change this to your physical thermostat entity
      climate_entity: &climate_entity climate.smart_thermostat
      # Change this if you want a different heat target temperature
      # Default is 80°F since physical thermostats often read differently than separate sensors
      heat_target: &heat_target 80

# ==============================================================================
# INTERNAL STATE
# ==============================================================================

input_boolean:
  coordinated_quick_heat_active:
    name: "Quick Heat Active"
    icon: mdi:fire
    # Internal flag - tracks if Quick Heat mode is currently active

# ==============================================================================
# SCRIPT
# ==============================================================================

script:
  toggle_mts300_to_heat:
    alias: "Toggle Quick Heat"
    sequence:
      - choose:
          # If currently heating, turn off
          - conditions:
              - condition: state
                entity_id: *climate_entity
                state: heat
            sequence:
              # Turn off physical thermostat
              - service: climate.turn_off
                target:
                  entity_id: *climate_entity

              # Clear Quick Heat flag first (before temperature changes that might trigger Manual Override)
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.coordinated_quick_heat_active

              # Check humidity FIRST before restoring temperature (prevents Manual Override race condition)
              - if:
                  - condition: state
                    entity_id: input_boolean.coordinated_humidity_enabled
                    state: "on"
                  - condition: state
                    entity_id: input_boolean.coordinated_humidity_suppressed
                    state: "off"
                  - condition: numeric_state
                    entity_id: sensor.max_indoor_humidity_sensor
                    above: input_number.coordinated_humidity_on_threshold
                then:
                  # HUMIDITY HIGH: Activate humidity control and set to floor temp
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.coordinated_humidity_active
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.coordinated_humidity_start_time
                    data:
                      datetime: "{{ now() }}"
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.coordinated_trigger_humidity
                    data:
                      value: "{{ states('sensor.max_indoor_humidity_sensor') | float(50) }}"
                  - service: climate.set_temperature
                    target:
                      entity_id: climate.coordinated_thermostat
                    data:
                      temperature: "{{ states('input_number.coordinated_humidity_floor_temp') | float(70) }}"
                  - service: system_log.write
                    data:
                      message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Turned off. Humidity high ({{ states('sensor.max_indoor_humidity_sensor') }}%), activated normal humidity control (AC to floor temp)."
                      level: warning
                else:
                  # HUMIDITY NORMAL: Restore to schedule/previous temp
                  - if:
                      - condition: state
                        entity_id: input_boolean.coordinated_schedule_enabled
                        state: "on"
                    then:
                      # Apply day or night temp based on current time
                      - service: climate.set_temperature
                        target:
                          entity_id: climate.coordinated_thermostat
                        data:
                          temperature: >
                        {% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}
                        {% set now_time = now() %}
                        {% if use_sun %}
                          {% set next_rising = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                          {% set next_setting = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                          {% set today_sunrise = next_rising if next_rising.date() == now_time.date() else next_rising - timedelta(days=1) %}
                          {% set today_sunset = next_setting if next_setting.date() == now_time.date() else next_setting - timedelta(days=1) %}
                          {% set day_offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
                          {% set night_offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
                          {% set day_start = today_sunrise + timedelta(minutes=day_offset) %}
                          {% set night_start = today_sunset + timedelta(minutes=night_offset) %}
                        {% else %}
                          {% set day_start = today_at(states('input_datetime.coordinated_day_start')) %}
                          {% set night_start = today_at(states('input_datetime.coordinated_night_start')) %}
                        {% endif %}
                        {% if day_start <= now_time < night_start %}
                          {{ states('input_number.coordinated_day_temp') | float(76) }}
                        {% else %}
                          {{ states('input_number.coordinated_night_temp') | float(73) }}
                        {% endif %}
                      - service: system_log.write
                        data:
                          message: >
                        {% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}
                        {% set now_time = now() %}
                        {% if use_sun %}
                          {% set next_rising = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                          {% set next_setting = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                          {% set today_sunrise = next_rising if next_rising.date() == now_time.date() else next_rising - timedelta(days=1) %}
                          {% set today_sunset = next_setting if next_setting.date() == now_time.date() else next_setting - timedelta(days=1) %}
                          {% set day_offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
                          {% set night_offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
                          {% set day_start = today_sunrise + timedelta(minutes=day_offset) %}
                          {% set night_start = today_sunset + timedelta(minutes=night_offset) %}
                        {% else %}
                          {% set day_start = today_at(states('input_datetime.coordinated_day_start')) %}
                          {% set night_start = today_at(states('input_datetime.coordinated_night_start')) %}
                        {% endif %}
                        {% set is_day = day_start <= now_time < night_start %}
                        {{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Turned off. Restored generic thermostat to {{ 'day' if is_day else 'night' }} temp {{ states('input_number.coordinated_day_temp') | int if is_day else states('input_number.coordinated_night_temp') | int }}°F.
                          level: warning
                    else:
                  # No schedule, restore to previous temp
                  - service: climate.set_temperature
                    target:
                      entity_id: climate.coordinated_thermostat
                    data:
                      temperature: "{{ states('input_number.coordinated_previous_temp') | float(76) }}"
                  - service: system_log.write
                    data:
                      message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Turned off. Restored generic thermostat to {{ states('input_number.coordinated_previous_temp') | round(0) | int }}°F."
                      level: warning
                  # Turn off standalone if humidity is normal and it's running
                  - if:
                      - condition: state
                        entity_id: humidifier.151732605035846_humidifier
                        state: "on"
                    then:
                      - service: humidifier.turn_off
                        target:
                          entity_id: humidifier.151732605035846_humidifier
                      - service: system_log.write
                        data:
                          message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Humidity normal ({{ states('sensor.max_indoor_humidity_sensor') }}%). Turned off standalone."
                          level: warning
        # Otherwise, turn on heat
        default:
          # If humidity control is active, exit it first to prevent AC/heat conflict
          - if:
              - condition: state
                entity_id: input_boolean.coordinated_humidity_active
                state: "on"
            then:
              # Turn off humidity control flag (but leave standalone running for now)
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.coordinated_humidity_active
              # Restore previous temperature on generic thermostat
              - service: climate.set_temperature
                target:
                  entity_id: climate.coordinated_thermostat
                data:
                  temperature: "{{ states('input_number.coordinated_previous_temp') | float(76) }}"
              - service: system_log.write
                data:
                  message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Exited humidity control. Standalone will stay on if humidity still high."
                  level: warning

          # Clear any suppression from previous manual overrides
          # This allows humidity control to re-activate when Quick Heat turns off
          - if:
              - condition: state
                entity_id: input_boolean.coordinated_humidity_suppressed
                state: "on"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.coordinated_humidity_suppressed
              - service: system_log.write
                data:
                  message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Cleared suppression flag to allow humidity control when Quick Heat deactivates."
                  level: warning

          # Set generic thermostat to high target to prevent AC/heat conflict
          # Target = heat_target + (2 × hot_tolerance) = 80 + (2 × 1.5) = 83°F
          # This prevents generic thermostat from trying to cool while heating
          # NOTE: Reads hot_tolerance dynamically, but heat_target is hardcoded (80)
          - service: climate.set_temperature
            target:
              entity_id: climate.coordinated_thermostat
            data:
              temperature: "{{ 80 + (2 * states('input_number.coordinated_hot_tolerance') | float(1.5)) }}"

          # Set physical thermostat to heat mode
          - service: climate.set_temperature
            data:
              entity_id: *climate_entity
              hvac_mode: heat
              temperature: *heat_target

          # Set Quick Heat flag
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.coordinated_quick_heat_active

          # Log activation
          - service: system_log.write
            data:
              message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Activated heat @ 80°F. Set generic thermostat to {{ 80 + (2 * states('input_number.coordinated_hot_tolerance') | float(1.5)) | round(1) }}°F to prevent AC conflict. Humidity control will use standalone only."
              level: warning

          # Check if humidity is high and needs control while Quick Heat is active
          - if:
              - condition: state
                entity_id: input_boolean.coordinated_humidity_enabled
                state: "on"
              - condition: state
                entity_id: input_boolean.coordinated_humidity_suppressed
                state: "off"
              - condition: numeric_state
                entity_id: sensor.max_indoor_humidity_sensor
                above: input_number.coordinated_humidity_on_threshold
            then:
              # Activate humidity control
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.coordinated_humidity_active
              # Save timestamp for absolute alert timing
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.coordinated_humidity_start_time
                data:
                  datetime: "{{ now() }}"
              # Save current temperature (83°F generic target)
              - service: input_number.set_value
                target:
                  entity_id: input_number.coordinated_previous_temp
                data:
                  value: "{{ state_attr('climate.coordinated_thermostat', 'temperature') | float(76) | round(0) }}"
              # Save triggering humidity value
              - service: input_number.set_value
                target:
                  entity_id: input_number.coordinated_trigger_humidity
                data:
                  value: "{{ states('sensor.max_indoor_humidity_sensor') | float(50) }}"
              # Activate standalone only (Quick Heat is on, don't use AC)
              - service: humidifier.turn_on
                target:
                  entity_id: humidifier.151732605035846_humidifier
              - service: system_log.write
                data:
                  message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Humidity high ({{ states('sensor.max_indoor_humidity_sensor') }}%). Activated humidity control with standalone only."
                  level: warning
            else:
              # Humidity is normal - turn off standalone if it's running
              - if:
                  - condition: state
                    entity_id: humidifier.151732605035846_humidifier
                    state: "on"
                then:
                  - service: humidifier.turn_off
                    target:
                      entity_id: humidifier.151732605035846_humidifier
                  - service: system_log.write
                    data:
                      message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Humidity normal ({{ states('sensor.max_indoor_humidity_sensor') }}%). Turned off standalone."
                      level: warning

# ==============================================================================
# AUTOMATIONS
# ==============================================================================

automation:
  # ============================================================================
  # Clear Quick Heat Flag When Humidity Normalizes
  # ============================================================================
  - id: coordinated_clear_quick_heat_flag_humidity
    alias: "Coordinated: Clear Quick Heat Flag (Humidity)"
    description: "Clear Quick Heat flag when humidity drops below threshold"
    trigger:
      - platform: numeric_state
        entity_id: sensor.max_indoor_humidity_sensor
        below: input_number.coordinated_humidity_off_threshold
    condition:
      - condition: state
        entity_id: input_boolean.coordinated_quick_heat_active
        state: "on"
      # Only clear if climate is no longer in heat mode (user already turned it off)
      # NOTE: Update this entity to match your climate_entity above
      - condition: template
        value_template: "{{ not is_state('climate.smart_thermostat', 'heat') }}"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.coordinated_quick_heat_active
      - service: system_log.write
        data:
          message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Flag cleared - humidity normalized and heat is off."
          level: warning
    mode: single

  # ============================================================================
  # Clear Quick Heat Flag When Climate Manually Changed
  # ============================================================================
  - id: coordinated_clear_quick_heat_flag_manual
    alias: "Coordinated: Clear Quick Heat Flag (Manual Change)"
    description: "Clear Quick Heat flag if user manually changes climate mode"
    trigger:
      - platform: state
        entity_id: climate.smart_thermostat
        attribute: hvac_mode
    condition:
      - condition: state
        entity_id: input_boolean.coordinated_quick_heat_active
        state: "on"
      # Clear flag if climate is no longer in heat mode
      # NOTE: Update this entity to match your climate_entity above
      - condition: template
        value_template: "{{ not is_state('climate.smart_thermostat', 'heat') }}"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.coordinated_quick_heat_active
      - service: system_log.write
        data:
          message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Flag cleared - climate manually changed to {{ states('climate.smart_thermostat') }}."
          level: warning
    mode: single

  # ============================================================================
  # Auto-Disable Quick Heat When Target Reached
  # ============================================================================
  - id: coordinated_quick_heat_auto_disable
    alias: "Coordinated: Quick Heat Auto-Disable"
    description: "Turn off Quick Heat when physical thermostat reaches target"
    trigger:
      # Trigger when current temp reaches or exceeds target temp
      - platform: template
        value_template: "{{ state_attr('climate.smart_thermostat', 'current_temperature') | float(0) >= state_attr('climate.smart_thermostat', 'temperature') | float(999) }}"
        for:
          minutes: 2
    condition:
      - condition: state
        entity_id: input_boolean.coordinated_quick_heat_active
        state: "on"
      # Ensure climate is still in heat mode (not manually changed to off/cool)
      # NOTE: Update this entity to match your climate_entity above
      - condition: state
        entity_id: climate.smart_thermostat
        state: "heat"
    action:
      # Re-check that we're still at/above target after trigger
      - condition: template
        value_template: "{{ state_attr('climate.smart_thermostat', 'current_temperature') | float(0) >= state_attr('climate.smart_thermostat', 'temperature') | float(999) }}"
      - condition: state
        entity_id: input_boolean.coordinated_quick_heat_active
        state: "on"
      - condition: state
        entity_id: climate.smart_thermostat
        state: "heat"

      # Turn off physical thermostat
      - service: climate.turn_off
        target:
          entity_id: climate.smart_thermostat

      # Clear Quick Heat flag first (before temperature changes that might trigger Manual Override)
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.coordinated_quick_heat_active

      # Check humidity FIRST before restoring temperature (prevents Manual Override race condition)
      - if:
          - condition: state
            entity_id: input_boolean.coordinated_humidity_enabled
            state: "on"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_suppressed
            state: "off"
          - condition: numeric_state
            entity_id: sensor.max_indoor_humidity_sensor
            above: input_number.coordinated_humidity_on_threshold
        then:
          # HUMIDITY HIGH: Activate humidity control and set to floor temp
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.coordinated_humidity_active
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.coordinated_humidity_start_time
            data:
              datetime: "{{ now() }}"
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_trigger_humidity
            data:
              value: "{{ states('sensor.max_indoor_humidity_sensor') | float(50) }}"
          - service: climate.set_temperature
            target:
              entity_id: climate.coordinated_thermostat
            data:
              temperature: "{{ states('input_number.coordinated_humidity_floor_temp') | float(70) }}"
          - service: system_log.write
            data:
              message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Auto-disabled - target reached. Humidity high ({{ states('sensor.max_indoor_humidity_sensor') }}%), activated normal humidity control (AC to floor temp)."
              level: warning
        else:
          # HUMIDITY NORMAL: Restore to schedule/previous temp
          - if:
              - condition: state
                entity_id: input_boolean.coordinated_schedule_enabled
                state: "on"
            then:
              # Apply day or night temp based on current time
              - service: climate.set_temperature
                target:
                  entity_id: climate.coordinated_thermostat
                data:
                  temperature: >
                {% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}
                {% set now_time = now() %}
                {% if use_sun %}
                  {% set next_rising = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                  {% set next_setting = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                  {% set today_sunrise = next_rising if next_rising.date() == now_time.date() else next_rising - timedelta(days=1) %}
                  {% set today_sunset = next_setting if next_setting.date() == now_time.date() else next_setting - timedelta(days=1) %}
                  {% set day_offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
                  {% set night_offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
                  {% set day_start = today_sunrise + timedelta(minutes=day_offset) %}
                  {% set night_start = today_sunset + timedelta(minutes=night_offset) %}
                {% else %}
                  {% set day_start = today_at(states('input_datetime.coordinated_day_start')) %}
                  {% set night_start = today_at(states('input_datetime.coordinated_night_start')) %}
                {% endif %}
                {% if day_start <= now_time < night_start %}
                  {{ states('input_number.coordinated_day_temp') | float(76) }}
                {% else %}
                  {{ states('input_number.coordinated_night_temp') | float(73) }}
                {% endif %}
              - service: system_log.write
                data:
                  message: >
                {% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}
                {% set now_time = now() %}
                {% if use_sun %}
                  {% set next_rising = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                  {% set next_setting = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                  {% set today_sunrise = next_rising if next_rising.date() == now_time.date() else next_rising - timedelta(days=1) %}
                  {% set today_sunset = next_setting if next_setting.date() == now_time.date() else next_setting - timedelta(days=1) %}
                  {% set day_offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
                  {% set night_offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
                  {% set day_start = today_sunrise + timedelta(minutes=day_offset) %}
                  {% set night_start = today_sunset + timedelta(minutes=night_offset) %}
                {% else %}
                  {% set day_start = today_at(states('input_datetime.coordinated_day_start')) %}
                  {% set night_start = today_at(states('input_datetime.coordinated_night_start')) %}
                {% endif %}
                {% set is_day = day_start <= now_time < night_start %}
                {{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Auto-disabled - target reached. Restored generic thermostat to {{ 'day' if is_day else 'night' }} temp {{ states('input_number.coordinated_day_temp') | int if is_day else states('input_number.coordinated_night_temp') | int }}°F.
                  level: warning
            else:
          # No schedule, restore to previous temp
          - service: climate.set_temperature
            target:
              entity_id: climate.coordinated_thermostat
            data:
              temperature: "{{ states('input_number.coordinated_previous_temp') | float(76) }}"
          - service: system_log.write
            data:
              message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Auto-disabled - target reached. Restored generic thermostat to {{ states('input_number.coordinated_previous_temp') | round(0) | int }}°F."
              level: warning
          # Turn off standalone if humidity is normal and it's running
          - if:
              - condition: state
                entity_id: humidifier.151732605035846_humidifier
                state: "on"
            then:
              - service: humidifier.turn_off
                target:
                  entity_id: humidifier.151732605035846_humidifier
              - service: system_log.write
                data:
                  message: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }} - Quick Heat: Humidity normal ({{ states('sensor.max_indoor_humidity_sensor') }}%). Turned off standalone."
                  level: warning
    mode: single

# ==============================================================================
# END OF PACKAGE
# ==============================================================================

# ==============================================================================
# DASHBOARD CARD - Quick Heat Button
# ==============================================================================
# Add this Mushroom template card to your Home Assistant dashboard.
# Update 'climate.smart_thermostat' to match your climate entity.
#
# Copy the YAML below (without the # comment markers):
# ------------------------------------------------------------------------------
#
# type: custom:mushroom-template-card
# primary: Quick Heat
# secondary: |-
#   {% if is_state('climate.smart_thermostat', 'heat') %}
#     Heating to {{ state_attr('climate.smart_thermostat', 'temperature') }}°F
#   {% elif is_state('climate.smart_thermostat', 'off') %}
#     Off
#   {% else %}
#     {{ states('climate.smart_thermostat') | title }}
#   {% endif %}
# icon: mdi:fire
# icon_color: |-
#   {% if is_state('climate.smart_thermostat', 'heat') %}
#     deep-orange
#   {% else %}
#     grey
#   {% endif %}
# tap_action:
#   action: call-service
#   service: script.toggle_mts300_to_heat
# hold_action:
#   action: more-info
#
# ------------------------------------------------------------------------------
# How it works:
# - Tap: Toggles between heat @ 80°F (or your configured value) and off
# - Icon: Fire icon, orange when heating, grey when off
# - Long press: Opens climate entity for manual control
# - When heating + humidity rises: Only standalone dehumidifier runs (AC won't interfere)
# ==============================================================================
