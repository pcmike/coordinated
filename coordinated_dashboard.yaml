type: vertical-stack
cards:
  # ==========================================================================
  # HERO STATUS CARD
  # ==========================================================================
  - type: custom:mushroom-template-card
    primary: >
      {{ states('sensor.third_reality_inc_3rths24bz_temperature') }}°F · 
      {{ states('sensor.max_indoor_humidity_sensor') }}%
    secondary: >
      {% set critical_hum = states('input_number.coordinated_critical_humidity') | float(55) %}
      {% set current_hum = states('sensor.max_indoor_humidity_sensor') | float(50) %}
      {% set is_critical = current_hum >= critical_hum %}
      {% if not is_state('input_boolean.coordinated_system_enabled', 'on') %}
        ⚠️ System Disabled
      {% elif is_state('switch.meross_cool_switch', 'on') %}
        {% if is_state('input_boolean.coordinated_cooling_temp_request', 'on') and is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}
          {% if is_critical %}🚨 CRITICAL: Cooling & Dehumidifying{% else %}🔥💧 Cooling & Dehumidifying{% endif %}
        {% elif is_state('input_boolean.coordinated_cooling_temp_request', 'on') %}
          🔥 Cooling for Temperature
        {% elif is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}
          {% if is_critical %}🚨 CRITICAL: Emergency Dehumidifying{% else %}💧 Dehumidifying{% endif %}
        {% else %}
          ❄️ AC Running
        {% endif %}
      {% elif is_state('humidifier.151732605035846_humidifier', 'on') %}
        {% if is_critical %}🚨 CRITICAL: Standalone Dehumidifying{% else %}🌬️ Standalone Dehumidifying{% endif %}
      {% elif is_state('timer.coordinated_cooler_min_cycle', 'active') %}
        ⏱️ Cooldown {{ states('sensor.coordinated_timer_display') }}
      {% else %}
        ✅ System Idle
      {% endif %}
    icon: mdi:home-thermometer-outline
    icon_color: >
      {% if not is_state('input_boolean.coordinated_system_enabled', 'on') %}red
      {% elif is_state('switch.meross_cool_switch', 'on') %}blue
      {% elif is_state('humidifier.151732605035846_humidifier', 'on') %}purple
      {% elif is_state('timer.coordinated_cooler_min_cycle', 'active') %}orange
      {% else %}green{% endif %}
    badge_icon: >
      {% set critical_hum = states('input_number.coordinated_critical_humidity') | float(55) %}
      {% set current_hum = states('sensor.max_indoor_humidity_sensor') | float(50) %}
      {% set is_critical = current_hum >= critical_hum %}
      {% if not is_state('input_boolean.coordinated_system_enabled', 'on') %}mdi:power-off
      {% elif is_critical %}mdi:alert-circle
      {% elif is_state('input_boolean.coordinated_cooling_temp_request', 'on') and is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}mdi:fire-circle
      {% elif is_state('input_boolean.coordinated_cooling_temp_request', 'on') %}mdi:fire
      {% elif is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}mdi:water
      {% elif is_state('humidifier.151732605035846_humidifier', 'on') %}mdi:air-humidifier
      {% elif is_state('timer.coordinated_cooler_min_cycle', 'active') %}mdi:timer-sand
      {% endif %}
    badge_color: >
      {% set critical_hum = states('input_number.coordinated_critical_humidity') | float(55) %}
      {% set current_hum = states('sensor.max_indoor_humidity_sensor') | float(50) %}
      {% set is_critical = current_hum >= critical_hum %}
      {% if not is_state('input_boolean.coordinated_system_enabled', 'on') %}red
      {% elif is_critical %}red
      {% elif is_state('input_boolean.coordinated_cooling_temp_request', 'on') and is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}purple
      {% elif is_state('input_boolean.coordinated_cooling_temp_request', 'on') %}red
      {% elif is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}blue
      {% elif is_state('humidifier.151732605035846_humidifier', 'on') %}purple
      {% elif is_state('timer.coordinated_cooler_min_cycle', 'active') %}orange
      {% endif %}
    tap_action:
      action: none
    hold_action:
      action: none
    card_mod:
      style: |
        ha-card {
          background: linear-gradient(135deg, rgba(var(--rgb-primary-color), 0.1) 0%, rgba(var(--rgb-accent-color), 0.05) 100%);
        }

  # ==========================================================================
  # UNIFIED STATUS BADGES
  # ==========================================================================
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: "{{ state_attr('sensor.coordinated_current_mode', 'icon') }}"
        content: "{{ states('sensor.coordinated_current_mode') }}"
        icon_color: "{{ 'amber' if states('sensor.coordinated_current_mode') == 'Day' else 'blue' }}"
        tap_action:
          action: none
      
      - type: template
        icon: mdi:floor-plan
        content: "{{ states('sensor.coordinated_temperature_floor') }}°F"
        icon_color: >
          {% set current = states('sensor.third_reality_inc_3rths24bz_temperature') | float(75) %}
          {% set floor = states('sensor.coordinated_temperature_floor') | float(70) %}
          {% if current > floor + 2 %}green
          {% elif current > floor %}orange
          {% else %}red{% endif %}
        tap_action:
          action: none
      
      - type: template
        icon: >
          {% set critical_hum = states('input_number.coordinated_critical_humidity') | float(55) %}
          {% set current_hum = states('sensor.max_indoor_humidity_sensor') | float(50) %}
          {% set is_critical = current_hum >= critical_hum %}
          {% set temp_on = is_state('input_boolean.coordinated_cooling_temp_request', 'on') %}
          {% set hum_on = is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}
          {% if is_critical %}mdi:alert-circle
          {% elif temp_on and hum_on %}mdi:fire-circle
          {% elif temp_on %}mdi:fire
          {% elif hum_on %}mdi:water
          {% else %}mdi:check-circle{% endif %}
        content: >
          {% set critical_hum = states('input_number.coordinated_critical_humidity') | float(55) %}
          {% set current_hum = states('sensor.max_indoor_humidity_sensor') | float(50) %}
          {% set is_critical = current_hum >= critical_hum %}
          {% set temp_on = is_state('input_boolean.coordinated_cooling_temp_request', 'on') %}
          {% set hum_on = is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}
          {% if is_critical %}CRITICAL
          {% elif temp_on and hum_on %}Both
          {% elif temp_on %}Temp
          {% elif hum_on %}Humid
          {% else %}Normal{% endif %}
        icon_color: >
          {% set critical_hum = states('input_number.coordinated_critical_humidity') | float(55) %}
          {% set current_hum = states('sensor.max_indoor_humidity_sensor') | float(50) %}
          {% set is_critical = current_hum >= critical_hum %}
          {% set temp_on = is_state('input_boolean.coordinated_cooling_temp_request', 'on') %}
          {% set hum_on = is_state('input_boolean.coordinated_cooling_hum_request', 'on') %}
          {% if is_critical %}red
          {% elif temp_on and hum_on %}purple
          {% elif temp_on %}red
          {% elif hum_on %}blue
          {% else %}green{% endif %}
        tap_action:
          action: none
      
      - type: template
        icon: mdi:timer-sand
        content: >
          {% if is_state('timer.coordinated_cooler_min_cycle', 'active') %}
            {{ states('sensor.coordinated_timer_display') }}
          {% else %}
            Ready
          {% endif %}
        icon_color: "{{ 'orange' if is_state('timer.coordinated_cooler_min_cycle', 'active') else 'green' }}"
        tap_action:
          action: none
      
      - type: template
        icon: mdi:air-conditioner
        content: AC
        icon_color: "{{ 'blue' if is_state('switch.meross_cool_switch', 'on') else 'disabled' }}"
        tap_action:
          action: none
      
      - type: template
        icon: mdi:air-humidifier
        content: Stand
        icon_color: "{{ 'purple' if is_state('humidifier.151732605035846_humidifier', 'on') else 'disabled' }}"
        tap_action:
          action: none

  # ==========================================================================
  # PRIMARY CONTROLS - CONSISTENT SIZING WITH CLIMATE CARD
  # ==========================================================================
  - type: custom:stack-in-card
    mode: vertical
    title: 🎛️ Climate Controls
    cards:
      # Temperature Control - Using climate card with proper formatting
      - type: custom:mushroom-climate-card
        entity: climate.coordinated_indoor_thermostat
        name: Temperature Target
        icon: mdi:thermometer
        hvac_modes: []
        show_temperature_control: true
        collapsible_controls: false
        layout: horizontal
        fill_container: false
      
      # Humidity Target
      - type: custom:mushroom-number-card
        entity: input_number.coordinated_target_humidity
        name: Humidity Target
        icon: mdi:water-percent
        display_mode: buttons
        layout: horizontal
        primary_info: name
        secondary_info: state
        fill_container: false
        card_mod:
          style: |
            ha-card {
              margin-top: -16px;
            }
      
      # Critical Humidity Threshold
      - type: custom:mushroom-number-card
        entity: input_number.coordinated_critical_humidity
        name: Critical Humidity (Emergency)
        icon: mdi:alert-circle
        display_mode: buttons
        layout: horizontal
        primary_info: name
        secondary_info: state
        fill_container: false
        card_mod:
          style: |
            ha-card {
              margin-top: -16px;
              background: rgba(244, 67, 54, 0.05);
            }

  # ==========================================================================
  # COLLAPSIBLE: DAY/NIGHT MODE
  # ==========================================================================
  - type: custom:mushroom-template-card
    primary: Day/Night Mode Configuration
    secondary: "{{ states('sensor.coordinated_current_mode') }} Mode · Floor: {{ states('sensor.coordinated_temperature_floor') }}°F"
    icon: mdi:weather-sunset
    icon_color: amber
    tap_action:
      action: call-service
      service: input_boolean.toggle
      service_data:
        entity_id: input_boolean.coordinated_daynight_expanded
    card_mod:
      style: |
        ha-card {
          cursor: pointer;
        }
  
  - type: conditional
    conditions:
      - entity: input_boolean.coordinated_daynight_expanded
        state: "on"
    card:
      type: custom:stack-in-card
      mode: vertical
      cards:
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_day_mode_start
          name: Day Mode Starts At
          icon: mdi:weather-sunny
          display_mode: slider
          layout: horizontal
          primary_info: name
          secondary_info: state
          fill_container: false
          card_mod:
            style: |
              ha-card {
                background: rgba(255, 193, 7, 0.05);
              }
        
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_night_mode_start
          name: Night Mode Starts At
          icon: mdi:weather-night
          display_mode: slider
          layout: horizontal
          primary_info: name
          secondary_info: state
          fill_container: false
          card_mod:
            style: |
              ha-card {
                margin-top: -16px;
                background: rgba(63, 81, 181, 0.05);
              }
        
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_day_floor_temp
          name: Day Floor Temperature
          icon: mdi:sun-thermometer
          display_mode: slider
          layout: horizontal
          primary_info: name
          secondary_info: state
          fill_container: false
          card_mod:
            style: |
              ha-card {
                margin-top: -16px;
                background: rgba(255, 152, 0, 0.05);
              }
        
        - type: custom:mushroom-template-card
          primary: Current Temperature Floor
          secondary: >
            {{ states('sensor.coordinated_temperature_floor') }}°F 
            ({{ states('sensor.coordinated_current_mode') }} Mode)
          icon: mdi:floor-plan
          icon_color: >
            {% set current = states('sensor.third_reality_inc_3rths24bz_temperature') | float(75) %}
            {% set floor = states('sensor.coordinated_temperature_floor') | float(70) %}
            {% if current > floor + 2 %}green
            {% elif current > floor %}orange
            {% else %}red{% endif %}
          tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                margin-top: -16px;
                background: rgba(var(--rgb-primary-text-color), 0.03);
              }

  # ==========================================================================
  # COLLAPSIBLE: HUMIDITY TUNING
  # ==========================================================================
  - type: custom:mushroom-template-card
    primary: Humidity Fine-Tuning
    secondary: "ON at {{ (states('input_number.coordinated_target_humidity') | float + states('input_number.coordinated_wet_tolerance') | float) | round(1) }}% · OFF at {{ (states('input_number.coordinated_target_humidity') | float - states('input_number.coordinated_dry_tolerance') | float) | round(1) }}%"
    icon: mdi:water-percent
    icon_color: blue
    tap_action:
      action: call-service
      service: input_boolean.toggle
      service_data:
        entity_id: input_boolean.coordinated_humidity_expanded
    card_mod:
      style: |
        ha-card {
          cursor: pointer;
        }
  
  - type: conditional
    conditions:
      - entity: input_boolean.coordinated_humidity_expanded
        state: "on"
    card:
      type: custom:stack-in-card
      mode: vertical
      cards:
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_wet_tolerance
          name: Turn ON Offset (above target)
          icon: mdi:arrow-up-bold
          display_mode: slider
          layout: horizontal
          primary_info: name
          secondary_info: state
          fill_container: false
        
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_dry_tolerance
          name: Turn OFF Offset (below target)
          icon: mdi:arrow-down-bold
          display_mode: slider
          layout: horizontal
          primary_info: name
          secondary_info: state
          fill_container: false
          card_mod:
            style: |
              ha-card {
                margin-top: -16px;
              }
        
        - type: custom:mushroom-template-card
          primary: Humidity Control Points
          secondary: >
            {% set target = states('input_number.coordinated_target_humidity') | float(49) %}
            {% set wet = states('input_number.coordinated_wet_tolerance') | float(0) %}
            {% set dry = states('input_number.coordinated_dry_tolerance') | float(3) %}
            Turn ON at {{ (target + wet) | round(1) }}% · Turn OFF at {{ (target - dry) | round(1) }}%
          icon: mdi:chart-bell-curve
          icon_color: blue
          tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                margin-top: -16px;
                background: rgba(33, 150, 243, 0.05);
              }

  # ==========================================================================
  # COLLAPSIBLE: SAFETY
  # ==========================================================================
  - type: custom:mushroom-template-card
    primary: Safety Settings
    secondary: >
      {% set current = states('sensor.third_reality_inc_3rths24bz_temperature') | float(72) %}
      {% set emergency = states('input_number.coordinated_emergency_temp') | float(66) %}
      {% set margin = current - emergency %}
      Emergency at {{ emergency }}°F · {{ margin | round(1) }}°F margin
    icon: mdi:shield-check
    icon_color: >
      {% set current = states('sensor.third_reality_inc_3rths24bz_temperature') | float(72) %}
      {% set emergency = states('input_number.coordinated_emergency_temp') | float(66) %}
      {% set margin = current - emergency %}
      {% if margin > 10 %}green
      {% elif margin > 6 %}orange
      {% else %}red{% endif %}
    tap_action:
      action: call-service
      service: input_boolean.toggle
      service_data:
        entity_id: input_boolean.coordinated_safety_expanded
    card_mod:
      style: |
        ha-card {
          cursor: pointer;
        }
  
  - type: conditional
    conditions:
      - entity: input_boolean.coordinated_safety_expanded
        state: "on"
    card:
      type: custom:stack-in-card
      mode: vertical
      cards:
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_emergency_temp
          name: Emergency Shutoff Temperature
          icon: mdi:alert-octagon
          display_mode: slider
          layout: horizontal
          primary_info: name
          secondary_info: state
          fill_container: false
          card_mod:
            style: |
              ha-card {
                background: rgba(244, 67, 54, 0.05);
                border: 1px solid rgba(244, 67, 54, 0.2);
              }
        
        - type: custom:mushroom-template-card
          primary: Safety Status
          secondary: >
            {% set current = states('sensor.third_reality_inc_3rths24bz_temperature') | float(72) %}
            {% set emergency = states('input_number.coordinated_emergency_temp') | float(66) %}
            {% set margin = current - emergency %}
            {% if margin > 10 %}
              ✅ Safe ({{ margin | round(1) }}°F above emergency)
            {% elif margin > 6 %}
              ⚠️ Caution ({{ margin | round(1) }}°F above emergency)
            {% elif margin > 4 %}
              🚨 Warning ({{ margin | round(1) }}°F above emergency)
            {% else %}
              🔴 DANGER ({{ margin | round(1) }}°F above emergency)
            {% endif %}
          icon: mdi:shield-check
          icon_color: >
            {% set current = states('sensor.third_reality_inc_3rths24bz_temperature') | float(72) %}
            {% set emergency = states('input_number.coordinated_emergency_temp') | float(66) %}
            {% set margin = current - emergency %}
            {% if margin > 10 %}green
            {% elif margin > 6 %}orange
            {% else %}red{% endif %}
          tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                margin-top: -16px;
              }

  # ==========================================================================
  # SYSTEM MASTER SWITCH
  # ==========================================================================
  - type: custom:mushroom-entity-card
    entity: input_boolean.coordinated_system_enabled
    name: System Master Switch
    icon: mdi:power
    tap_action:
      action: toggle
    hold_action:
      action: none
    icon_color: "{{ 'green' if is_state('input_boolean.coordinated_system_enabled', 'on') else 'red' }}"
    card_mod:
      style: |
        ha-card {
          background: {% if is_state('input_boolean.coordinated_system_enabled', 'on') %}rgba(76, 175, 80, 0.1){% else %}rgba(244, 67, 54, 0.1){% endif %};
          border: 2px solid {% if is_state('input_boolean.coordinated_system_enabled', 'on') %}rgba(76, 175, 80, 0.3){% else %}rgba(244, 67, 54, 0.3){% endif %};
        }

  # ==========================================================================
  # COLLAPSIBLE: DIAGNOSTICS
  # ==========================================================================
  - type: custom:mushroom-template-card
    primary: System Diagnostics
    secondary: "Tap to view detailed system information"
    icon: mdi:chart-line
    icon_color: grey
    tap_action:
      action: call-service
      service: input_boolean.toggle
      service_data:
        entity_id: input_boolean.coordinated_diagnostics_expanded
    card_mod:
      style: |
        ha-card {
          cursor: pointer;
        }
  
  - type: conditional
    conditions:
      - entity: input_boolean.coordinated_diagnostics_expanded
        state: "on"
    card:
      type: custom:stack-in-card
      mode: vertical
      cards:
        - type: entities
          entities:
            - entity: sensor.third_reality_inc_3rths24bz_temperature
              name: Master Temperature
              secondary_info: last-changed
            - entity: sensor.third_reality_inc_3rths24bz_humidity
              name: Master Humidity
              secondary_info: last-changed
            - entity: sensor.max_indoor_humidity_sensor
              name: Max Humidity (Trigger)
              secondary_info: last-changed
          card_mod:
            style: |
              ha-card {
                box-shadow: none;
              }
        
        - type: markdown
          content: |
            {% set hour = now().hour %}
            {% set day_start = states('input_number.coordinated_day_mode_start') | int(6) %}
            {% set night_start = states('input_number.coordinated_night_mode_start') | int(21) %}
            {% if night_start > day_start %}
              {% set is_night = hour >= night_start or hour < day_start %}
            {% else %}
              {% set is_night = hour >= night_start and hour < day_start %}
            {% endif %}
            {% set setpoint = state_attr('climate.coordinated_indoor_thermostat', 'temperature') | float(75) %}
            {% set current = states('sensor.third_reality_inc_3rths24bz_temperature') | float(75) %}
            {% set floor = states('sensor.coordinated_temperature_floor') | float(70) %}
            {% set target_hum = states('input_number.coordinated_target_humidity') | float(49) %}
            {% set current_hum = states('sensor.max_indoor_humidity_sensor') | float(50) %}
            {% set critical_hum = states('input_number.coordinated_critical_humidity') | float(55) %}
            {% set wet_tol = states('input_number.coordinated_wet_tolerance') | float(0) %}
            {% set dry_tol = states('input_number.coordinated_dry_tolerance') | float(3) %}
            
            **Mode:** {{ 'Night' if is_night else 'Day' }} ({{ hour }}:00)
            **Floor:** {{ floor }}°F {{ '(calculated)' if is_night else '(flat)' }}
            **Current Temp:** {{ current }}°F
            **Distance from Floor:** {{ (current - floor) | round(1) }}°F
            **AC Allowed:** {{ '✅ Yes' if current > floor else '❌ No' }}
            
            **Humidity Status:**
            - Current: {{ current_hum }}%
            - Target: {{ target_hum }}%
            - Turn ON at: {{ (target_hum + wet_tol) | round(1) }}%
            - Turn OFF at: {{ (target_hum - dry_tol) | round(1) }}%
            - Critical at: {{ critical_hum }}%
            - Status: {{ '🚨 CRITICAL' if current_hum >= critical_hum else '✅ Normal' }}
          card_mod:
            style: |
              ha-card {
                background: rgba(var(--rgb-primary-text-color), 0.03);
                font-size: 12px;
              }
