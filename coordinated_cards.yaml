type: custom:expander-card
expanded: false
padding: 0
title-card:
  type: horizontal-stack
  cards:
    - type: custom:mushroom-template-card
      primary: "Humidity: {{ states('sensor.max_indoor_humidity_sensor') | float(0) | round(1) }}%"
      icon: mdi:water-percent
      icon_color: |
        {% if is_state('input_boolean.coordinated_humidity_enabled', 'off') %}
          grey
        {% elif is_state('binary_sensor.coordinated_standalone_running', 'on') %}
          red
        {% elif is_state('binary_sensor.coordinated_ac_for_humidity', 'on') %}
          orange
        {% else %}
          blue
        {% endif %}
      entity: input_boolean.coordinated_humidity_enabled
      tap_action:
        action: toggle
    - type: custom:mushroom-template-card
      primary: "Indoor: {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | float(0) | round(1) }}°F"
      icon: mdi:snowflake
      icon_color: |
        {% if states('climate.coordinated_thermostat') == 'off' %}
          grey
        {% elif is_state('input_boolean.coordinated_humidity_active', 'on') %}
          orange
        {% else %}
          blue
        {% endif %}
      tap_action:
        action: more-info
      entity: climate.coordinated_thermostat
title-card-button-overlay: true
cards:
  - type: markdown
    content: |
      {% if is_state('input_boolean.coordinated_humidity_enabled', 'off') %}🚫 **Humidity Off** — Humidity control disabled{% elif is_state('input_boolean.coordinated_humidity_active', 'on') and is_state('humidifier.151732605035846_humidifier', 'on') %}🔴 **Standalone** — Triggered at {{ states('input_number.coordinated_trigger_humidity') | int }}%, dehumidifier on until < {{ states('input_number.coordinated_humidity_off_threshold') | int(47) }}%{% elif is_state('input_boolean.coordinated_humidity_active', 'on') %}🟠 **Active** — Triggered at {{ states('input_number.coordinated_trigger_humidity') | int }}%, cooling to {{ states('input_number.coordinated_humidity_floor_temp') | int(70) }}°F until < {{ states('input_number.coordinated_humidity_off_threshold') | int(47) }}%{% elif is_state('input_boolean.coordinated_humidity_suppressed', 'on') %}⏸️ **Paused** — Waiting for humidity < {{ states('input_number.coordinated_humidity_off_threshold') | int(47) }}%{% else %}✅ **Ready** — Will activate when humidity > {{ states('input_number.coordinated_humidity_on_threshold') | int(49) }}%{% endif %}
  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.coordinated_humidity_enabled
        state: "on"
    card:
      type: horizontal-stack
      cards:
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_humidity_on_threshold
          display_mode: slider
          primary_info: state
          secondary_info: none
          icon_color: "#EF9A9A"
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_humidity_off_threshold
          display_mode: slider
          primary_info: state
          secondary_info: none
          icon_color: "#4CAF50"
        - type: custom:mushroom-number-card
          entity: input_number.coordinated_humidity_floor_temp
          display_mode: slider
          primary_info: state
          secondary_info: none
          icon_color: "#FFB74D"
  - type: custom:expander-card
    expanded: false
    padding: 0
    title-card:
      type: markdown
      content: |
        {% if is_state('input_boolean.coordinated_schedule_enabled', 'off') %}🚫 **Schedule Off** — Day/night automation disabled{% else %}{% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}{% if use_sun %}{% set day_str = 'Sunrise −30m' %}{% set night_str = 'Sunset −30m' %}{% else %}{% set day_time = states('input_datetime.coordinated_day_start') | default('06:00:00', true) %}{% set day_hour = day_time.split(':')[0] | int(0) %}{% set day_min = day_time.split(':')[1] | default('00', true) %}{% set day_ampm = 'AM' if day_hour < 12 else 'PM' %}{% set day_hour_12 = day_hour if day_hour <= 12 else day_hour - 12 %}{% set day_hour_12 = 12 if day_hour_12 == 0 else day_hour_12 %}{% set day_str = day_hour_12 | string ~ ':' ~ day_min ~ ' ' ~ day_ampm %}{% set night_time = states('input_datetime.coordinated_night_start') | default('21:00:00', true) %}{% set night_hour = night_time.split(':')[0] | int(0) %}{% set night_min = night_time.split(':')[1] | default('00', true) %}{% set night_ampm = 'AM' if night_hour < 12 else 'PM' %}{% set night_hour_12 = night_hour if night_hour <= 12 else night_hour - 12 %}{% set night_hour_12 = 12 if night_hour_12 == 0 else night_hour_12 %}{% set night_str = night_hour_12 | string ~ ':' ~ night_min ~ ' ' ~ night_ampm %}{% endif %}🕐 **Schedule** — ☀️ {{ states('input_number.coordinated_day_temp') | int(76) }}°F at {{ day_str }} · 🌙 {{ states('input_number.coordinated_night_temp') | int(73) }}°F at {{ night_str }}{% endif %}
    title-card-button-overlay: true
    cards:
      - type: horizontal-stack
        cards:
          - type: custom:stack-in-card
            mode: vertical
            cards:
              - type: custom:mushroom-chips-card
                alignment: center
                card_mod:
                  style: |
                    ha-card {
                      --chip-icon-size: 40px;
                      --chip-height: 50px;
                      --chip-background: transparent;
                      --chip-border-width: 0;
                      background: none !important;
                      box-shadow: none !important;
                    }
                chips:
                  - type: entity
                    entity: input_boolean.coordinated_schedule_enabled
                    icon_color: blue
                    content_info: none
                    tap_action:
                      action: toggle
              - type: custom:mushroom-chips-card
                alignment: center
                card_mod:
                  style: |
                    ha-card {
                      --chip-icon-size: 40px;
                      --chip-height: 50px;
                      --chip-background: transparent;
                      --chip-border-width: 0;
                      background: none !important;
                      box-shadow: none !important;
                    }
                chips:
                  - type: entity
                    entity: input_boolean.coordinated_use_sun
                    icon_color: amber
                    content_info: none
                    tap_action:
                      action: toggle
          - type: custom:mushroom-number-card
            entity: input_number.coordinated_day_temp
            display_mode: slider
            primary_info: state
            secondary_info: none
            icon_color: amber
          - type: custom:mushroom-number-card
            entity: input_number.coordinated_night_temp
            display_mode: slider
            primary_info: state
            secondary_info: none
            icon_color: indigo
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.coordinated_use_sun
            state: "on"
        card:
          type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              primary: "Day: {{ ((state_attr('sun.sun', 'next_rising') | as_datetime | as_local) + timedelta(minutes=-30)).strftime('%H:%M') }}"
              secondary: "Sunrise −30m (edit offset in YAML)"
              icon: mdi:weather-sunset-up
              icon_color: amber
              tap_action:
                action: none
            - type: custom:mushroom-template-card
              primary: "Night: {{ ((state_attr('sun.sun', 'next_setting') | as_datetime | as_local) + timedelta(minutes=-30)).strftime('%H:%M') }}"
              secondary: "Sunset −30m (edit offset in YAML)"
              icon: mdi:weather-sunset-down
              icon_color: indigo
              tap_action:
                action: none
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.coordinated_use_sun
            state: "off"
        card:
          type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              entity: input_datetime.coordinated_day_start
              primary: "Daytime start: {{ (states('input_datetime.coordinated_day_start') | default('06:00:00', true))[:5] }}"
              icon: mdi:weather-sunny
              icon_color: amber
              tap_action:
                action: more-info
            - type: custom:mushroom-template-card
              entity: input_datetime.coordinated_night_start
              primary: "Nighttime start: {{ (states('input_datetime.coordinated_night_start') | default('21:00:00', true))[:5] }}"
              icon: mdi:weather-night
              icon_color: indigo
              tap_action:
                action: more-info
  - type: custom:expander-card
    expanded: false
    padding: 0
    title-card:
      type: markdown
      content: |
        🔍 **Debug Values** — Tap to expand troubleshooting info
    title-card-button-overlay: true
    cards:
      - type: markdown
        content: |
          ## Time & Sun
          - Current: {{ now().strftime('%H:%M:%S') }}
          - Sunrise: {{ (state_attr('sun.sun', 'next_rising') | as_datetime | as_local).strftime('%H:%M') }}
          - Sunset: {{ (state_attr('sun.sun', 'next_setting') | as_datetime | as_local).strftime('%H:%M') }}

          ## Temperature
          - Current: {{ state_attr('climate.coordinated_thermostat', 'current_temperature') }}°F
          - Generic Target: {{ state_attr('climate.coordinated_thermostat', 'temperature') }}°F
          - Day Temp: {{ states('input_number.coordinated_day_temp') }}°F
          - Night Temp: {{ states('input_number.coordinated_night_temp') }}°F
          - Floor Temp: {{ states('input_number.coordinated_humidity_floor_temp') }}°F
          - Previous Temp: {{ states('input_number.coordinated_previous_temp') }}°F

          ## Humidity
          - Current: {{ states('sensor.max_indoor_humidity_sensor') }}%
          - ON Threshold: {{ states('input_number.coordinated_humidity_on_threshold') }}%
          - OFF Threshold: {{ states('input_number.coordinated_humidity_off_threshold') }}%
          - Trigger Value: {{ states('input_number.coordinated_trigger_humidity') }}%
          - Started: {% set dt = states('input_datetime.coordinated_humidity_start_time') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt and dt != 'unknown' else 'N/A' }}

          ## Control Flags
          - Humidity Enabled: {{ states('input_boolean.coordinated_humidity_enabled') }}
          - Humidity Active: {{ states('input_boolean.coordinated_humidity_active') }}
          - Humidity Suppressed: {{ states('input_boolean.coordinated_humidity_suppressed') }}
          - Quick Heat Active: {{ states('input_boolean.coordinated_quick_heat_active') }}
          - Schedule Enabled: {{ states('input_boolean.coordinated_schedule_enabled') }}
          - Use Sun: {{ states('input_boolean.coordinated_use_sun') }}

          ## Schedule Triggers
          - Day trigger: {{ ((state_attr('sun.sun', 'next_rising') | as_datetime | as_local) + timedelta(minutes=-30)).strftime('%H:%M') }} (sunrise −30m, hardcoded in YAML)
          - Night trigger: {{ ((state_attr('sun.sun', 'next_setting') | as_datetime | as_local) + timedelta(minutes=-30)).strftime('%H:%M') }} (sunset −30m, hardcoded in YAML)

          ## Tolerances
          - Hot Tolerance: {{ states('input_number.coordinated_hot_tolerance') }}°F
          - Cold Tolerance: {{ states('input_number.coordinated_cold_tolerance') }}°F
          - Floor Tolerance: {{ states('input_number.coordinated_floor_temp_tolerance') }}°F

          ## Devices
          - AC: {{ states('switch.meross_cool_switch') }}
          - Standalone: {{ states('humidifier.151732605035846_humidifier') }}
          - Generic: {{ states('climate.coordinated_thermostat') }}
          - Physical: {{ states('climate.smart_thermostat') }}

          ## Last Triggered
          - HA restart: {% set dt = state_attr('automation.coordinated_startup_sync', 'last_triggered') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt else 'Never' }}
          - Day Mode: {% set dt = state_attr('automation.coordinated_day_mode', 'last_triggered') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt else 'Never' }}
          - Night Mode: {% set dt = state_attr('automation.coordinated_night_mode', 'last_triggered') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt else 'Never' }}
          - Humidity High: {% set dt = state_attr('automation.coordinated_humidity_high', 'last_triggered') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt else 'Never' }}
          - Humidity Normal: {% set dt = state_attr('automation.coordinated_humidity_normal', 'last_triggered') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt else 'Never' }}
          - Standalone Fallback: {% set dt = state_attr('automation.coordinated_standalone_fallback', 'last_triggered') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt else 'Never' }}
          - Manual Override: {% set dt = state_attr('automation.coordinated_manual_override', 'last_triggered') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt else 'Never' }}
          - Clear Suppression: {% set dt = state_attr('automation.coordinated_clear_suppression', 'last_triggered') %}{{ (dt | as_datetime | as_local | as_timestamp | timestamp_custom('%m/%d %H:%M')) if dt else 'Never' }}

          ## Automation Status
          - Day Mode: {{ states('automation.coordinated_day_mode') }}
          - Night Mode: {{ states('automation.coordinated_night_mode') }}
          - Humidity High: {{ states('automation.coordinated_humidity_high') }}
          - Humidity Normal: {{ states('automation.coordinated_humidity_normal') }}
          - Standalone Fallback: {{ states('automation.coordinated_standalone_fallback') }}
          - Manual Override: {{ states('automation.coordinated_manual_override') }}
          - Clear Suppression: {{ states('automation.coordinated_clear_suppression') }}
          - Startup Sync: {{ states('automation.coordinated_startup_sync') }}
