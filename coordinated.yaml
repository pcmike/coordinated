# ==============================================================================
# COORDINATED COOLER CONTROL PACKAGE v6.8
# ==============================================================================
#
# A simple, elegant approach to coordinating AC and humidity control using
# the generic_thermostat's built-in preset system.
#
# HOW IT WORKS:
#   1. Normal operation: Thermostat runs at your chosen preset (home/sleep/away)
#   2. High humidity (>49%): Lowers to floor temperature (default 70°F) to dehumidify
#   3. If AC can't clear humidity (temp at floor): Standalone dehumidifier helps
#   4. Humidity normal (<47%): Returns to previous temperature
#
# ==============================================================================

# ==============================================================================
# USER CONFIGURATION
# ==============================================================================
# Adjust these values via Home Assistant dashboard or edit defaults here.

input_number:
  coordinated_humidity_on_threshold:
    name: "Humidity ON Threshold"
    min: 40
    max: 70
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-plus
    # Humidity level that triggers dehumidification mode (default: 49%)

  coordinated_humidity_off_threshold:
    name: "Humidity OFF Threshold"
    min: 35
    max: 65
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-minus
    # Humidity level that returns to normal preset (default: 47%)

  coordinated_humidity_floor_temp:
    name: "Humidity Floor Temperature"
    min: 65
    max: 75
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-low
    # Temperature to cool to when dehumidifying (default: 70°F)

  coordinated_previous_temp:
    name: "Previous Temperature"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    # Stores the temperature to restore if no preset was active

  coordinated_trigger_humidity:
    name: "Trigger Humidity"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"
    # Stores the humidity level that triggered dehumidification

  coordinated_day_temp:
    name: "Day Temperature"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:white-balance-sunny
    # Temperature during daytime hours (default: 76°F)

  coordinated_night_temp:
    name: "Night Temperature"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:moon-waning-crescent
    # Temperature during nighttime hours (default: 73°F)

  coordinated_day_sun_offset:
    name: "Day Sunrise Offset"
    min: -120
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-plus-outline
    # Minutes before (-) or after (+) sunrise (default: 0)

  coordinated_night_sun_offset:
    name: "Night Sunset Offset"
    min: -120
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-minus-outline
    # Minutes before (-) or after (+) sunset (default: -30)

  # ===========================================================================
  # ADVANCED INPUT NUMBERS
  # ===========================================================================
  # WARNING: These settings are used internally by automations. Only modify
  # if you understand the implications.

  coordinated_hot_tolerance:
    name: "Hot Tolerance (Advanced)"
    min: 0.5
    max: 3.0
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-alert
    initial: 1.5
    mode: box
    # MUST match generic_thermostat hot_tolerance setting
    # Used to calculate when AC will actually run: temp > (target + hot_tolerance)

  coordinated_cold_tolerance:
    name: "Cold Tolerance (Advanced)"
    min: 0.5
    max: 3.0
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-alert
    initial: 0.5
    mode: box
    # MUST match generic_thermostat cold_tolerance setting
    # Currently not used in automations but provided for completeness

  coordinated_alert_delay_minutes:
    name: "Alert Delay Minutes (Advanced)"
    min: 15
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-outline
    initial: 60
    mode: box
    # Time to wait before sending notification if humidity not clearing
    # Default: 45 minutes gives AC and standalone adequate time to work

  coordinated_alert_humidity_drop_threshold:
    name: "Alert Humidity Drop Threshold (Advanced)"
    min: 1
    max: 10
    step: 0.5
    unit_of_measurement: "%"
    icon: mdi:water-percent
    initial: 3
    mode: box
    # Required humidity improvement to avoid notification
    # If humidity hasn't dropped this much from trigger value, alert is sent
    # Default: 3% drop indicates reasonable progress
    # NOTE: This can be larger than your ON/OFF threshold gap (e.g., 49%-47%=2%).
    # This is OK because if humidity drops below OFF threshold, humidity control
    # exits and the alert check never runs. Alert only fires if humidity is stuck
    # above OFF threshold without making adequate progress.

  coordinated_floor_temp_tolerance:
    name: "Floor Temperature Tolerance (Advanced)"
    min: 0.5
    max: 3.0
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-down
    initial: 1.0
    mode: box
    # Temperature tolerance for determining if AC has reached floor temp
    # Used by Standalone Fallback automation to decide when to activate standalone
    # Default: 1.0°F means standalone activates when temp <= floor + 1°F

input_datetime:
  coordinated_day_start:
    name: "Day Start Time"
    has_date: false
    has_time: true
    icon: mdi:weather-sunny

  coordinated_night_start:
    name: "Night Start Time"
    has_date: false
    has_time: true
    icon: mdi:weather-night

  coordinated_humidity_start_time:
    name: "Humidity Start Time (Internal)"
    has_date: true
    has_time: true
    icon: mdi:clock-start
    # Internal tracking - timestamp when humidity control activated
    # Used to calculate absolute alert timing across HA restarts

# ==============================================================================
# INTERNAL STATE
# ==============================================================================

input_boolean:
  coordinated_initialized:
    name: "Package Initialized"
    icon: mdi:check-circle
    # Internal flag - tracks if first-run defaults have been applied
    # No 'initial' so it persists across restarts

  coordinated_humidity_enabled:
    name: "Humidity Control Enabled"
    icon: mdi:water-check
    # Enable or disable automatic humidity control (default: on)

  coordinated_schedule_enabled:
    name: "Day/Night Schedule Enabled"
    icon: mdi:calendar-clock
    # Enable or disable automatic day/night temperature switching (default: on)

  coordinated_use_sun:
    name: "Use Sunrise/Sunset"
    icon: mdi:weather-sunset
    # If on, use sunrise/sunset instead of fixed times (default: on)

  coordinated_humidity_active:
    name: "Humidity Control Active"
    icon: mdi:water-alert
    # Internal state - tracks if humidity control is currently active

  coordinated_humidity_suppressed:
    name: "Humidity Control Suppressed"
    icon: mdi:water-off
    # Internal state - prevents re-entry after manual override

# ==============================================================================
# TEMPLATE SENSORS
# ==============================================================================

template:
  - binary_sensor:
      - name: "Coordinated AC Running"
        unique_id: coordinated_ac_running
        state: "{{ states('switch.meross_cool_switch') }}"
        icon: mdi:snowflake

      - name: "Coordinated AC For Temp"
        unique_id: coordinated_ac_for_temp
        state: "{{ is_state('switch.meross_cool_switch', 'on') and is_state('input_boolean.coordinated_humidity_active', 'off') }}"
        icon: mdi:thermometer

      - name: "Coordinated AC For Humidity"
        unique_id: coordinated_ac_for_humidity
        state: "{{ is_state('switch.meross_cool_switch', 'on') and is_state('input_boolean.coordinated_humidity_active', 'on') }}"
        icon: mdi:water-percent

      - name: "Coordinated Standalone Running"
        unique_id: coordinated_standalone_running
        state: "{{ is_state('humidifier.151732605035846_humidifier', 'on') }}"
        icon: mdi:air-humidifier

  - sensor:
      - name: "Coordinated Day Trigger Time"
        unique_id: coordinated_day_trigger_time
        state: >
          {% if is_state('input_boolean.coordinated_use_sun', 'on') %}
            {% set sunrise = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
            {% set offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
            {{ (sunrise + timedelta(minutes=offset)).strftime('%H:%M:%S') }}
          {% else %}
            {{ states('input_datetime.coordinated_day_start') }}
          {% endif %}
        icon: mdi:weather-sunny

      - name: "Coordinated Night Trigger Time"
        unique_id: coordinated_night_trigger_time
        state: >
          {% if is_state('input_boolean.coordinated_use_sun', 'on') %}
            {% set sunset = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
            {% set offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
            {{ (sunset + timedelta(minutes=offset)).strftime('%H:%M:%S') }}
          {% else %}
            {{ states('input_datetime.coordinated_night_start') }}
          {% endif %}
        icon: mdi:weather-night

# ==============================================================================
# CLIMATE - GENERIC THERMOSTAT
# ==============================================================================
# WARNING: If you change hot_tolerance or cold_tolerance below, you MUST also
# update coordinated_hot_tolerance and coordinated_cold_tolerance in the
# ADVANCED CONFIGURATION section above to match. These values are used by
# automations to determine when standalone dehumidifier should activate.

climate:
  - platform: generic_thermostat
    name: "Coordinated Thermostat"
    unique_id: coordinated_thermostat
    heater: switch.meross_cool_switch
    target_sensor: sensor.third_reality_inc_3rths24bz_temperature
    ac_mode: true
    initial_hvac_mode: "cool"
    min_temp: 65
    max_temp: 85
    target_temp: 76
    hot_tolerance: 1.5  # MUST match coordinated_hot_tolerance above
    cold_tolerance: 0.5  # MUST match coordinated_cold_tolerance above
    min_cycle_duration:
      minutes: 15
    away_temp: 78
    home_temp: 76
    sleep_temp: 73
    activity_temp: 70
    precision: 0.1
    target_temp_step: 1

# ==============================================================================
# AUTOMATIONS
# ==============================================================================

automation:
  # ============================================================================
  # HUMIDITY HIGH - Activate Activity Preset
  # ============================================================================
  - id: coordinated_humidity_high
    alias: "Coordinated: Humidity High - Activate Dehumidification"
    description: "Switch to activity preset when humidity exceeds threshold"
    trigger:
      - platform: numeric_state
        entity_id: sensor.max_indoor_humidity_sensor
        above: input_number.coordinated_humidity_on_threshold
    condition:
      # Only trigger if humidity control is enabled
      - condition: state
        entity_id: input_boolean.coordinated_humidity_enabled
        state: "on"
      # And not already in humidity control mode
      - condition: state
        entity_id: input_boolean.coordinated_humidity_active
        state: "off"
      # And not suppressed due to manual override
      - condition: state
        entity_id: input_boolean.coordinated_humidity_suppressed
        state: "off"
    action:
      # Mark humidity control as active FIRST (crash-safe: ensures state tracked even if restart during setup)
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.coordinated_humidity_active
      - wait_template: "{{ is_state('input_boolean.coordinated_humidity_active', 'on') }}"
        timeout:
          seconds: 5

      # Save timestamp for absolute alert timing
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.coordinated_humidity_start_time
        data:
          datetime: "{{ now() }}"

      # Save current temperature (rounded to whole number)
      - service: input_number.set_value
        target:
          entity_id: input_number.coordinated_previous_temp
        data:
          value: "{{ state_attr('climate.coordinated_thermostat', 'temperature') | float(76) | round(0) }}"

      # Save triggering humidity value
      - service: input_number.set_value
        target:
          entity_id: input_number.coordinated_trigger_humidity
        data:
          value: "{{ states('sensor.max_indoor_humidity_sensor') | float(50) }}"

      # Check if Quick Heat is active (optional package: coordinated_quick_heat.yaml)
      # If active, only use standalone dehumidifier (don't interfere with manual heat)
      # If Quick Heat package not installed, this condition returns false and uses normal mode
      - if:
          - condition: template
            value_template: "{{ states('input_boolean.coordinated_quick_heat_active') == 'on' }}"
        then:
          # QUICK HEAT MODE: Only activate standalone, don't set floor temp or use AC
          - service: humidifier.turn_on
            target:
              entity_id: humidifier.151732605035846_humidifier
          - service: system_log.write
            data:
              message: "Coordinated: Quick Heat active. Humidity high ({{ states('sensor.max_indoor_humidity_sensor') }}%). Using standalone only (AC will not interfere with heat)."
              level: warning
        else:
          # NORMAL MODE: Use AC to cool to floor temp + standalone as needed
          # Lower to floor temperature for dehumidification
          - service: climate.set_temperature
            target:
              entity_id: climate.coordinated_thermostat
            data:
              temperature: "{{ states('input_number.coordinated_humidity_floor_temp') | float(70) }}"

          # Log the event
          - service: system_log.write
            data:
              message: "Coordinated: Humidity high ({{ states('sensor.max_indoor_humidity_sensor') }}%). Lowering to {{ states('input_number.coordinated_humidity_floor_temp') | int }}°F to dehumidify."
              level: warning

          # Check if AC can actually run given current temperature and generic_thermostat tolerances
          # AC only runs when: current_temp > (target_temp + hot_tolerance)
          # If temperature is within tolerance band, AC won't turn on - activate standalone immediately
          - if:
              - condition: template
                value_template: >
                  {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | float(999)
                     <= (states('input_number.coordinated_humidity_floor_temp') | float(70) + states('input_number.coordinated_hot_tolerance') | float(1.5)) }}
            then:
              - service: humidifier.turn_on
                target:
                  entity_id: humidifier.151732605035846_humidifier
              - service: system_log.write
                data:
                  message: >
                    Coordinated: Standalone activated immediately. Current temp {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | round(1) }}°F
                    is within hot_tolerance ({{ states('input_number.coordinated_hot_tolerance') | float(1.5) }}°F) of floor temp {{ states('input_number.coordinated_humidity_floor_temp') | int }}°F.
                    AC won't run until temp exceeds {{ (states('input_number.coordinated_humidity_floor_temp') | float(70) + states('input_number.coordinated_hot_tolerance') | float(1.5)) | round(1) }}°F.
                    Humidity at {{ states('sensor.max_indoor_humidity_sensor') }}%.
                  level: warning

          # Wait for absolute time (start + delay) to ensure consistent timing across HA restarts
          - wait_template: >
              {% set start = states('input_datetime.coordinated_humidity_start_time') | as_datetime | as_local %}
              {% set delay_min = states('input_number.coordinated_alert_delay_minutes') | int(45) %}
              {% if start %}
                {{ (now() - start).total_seconds() / 60 >= delay_min }}
              {% else %}
                false
              {% endif %}
            timeout:
              hours: 3
          - if:
              - condition: state
                entity_id: input_boolean.coordinated_humidity_active
                state: "on"
              - condition: template
                value_template: >
                  {{ states('sensor.max_indoor_humidity_sensor') | float(0)
                     > (states('input_number.coordinated_trigger_humidity') | float(50) - states('input_number.coordinated_alert_humidity_drop_threshold') | float(3)) }}
            then:
              # Activate standalone as failsafe if not already running
              - if:
                  - condition: state
                    entity_id: humidifier.151732605035846_humidifier
                    state: "off"
                then:
                  - service: humidifier.turn_on
                    target:
                      entity_id: humidifier.151732605035846_humidifier
                  - service: system_log.write
                    data:
                      message: >
                        Coordinated: {{ states('input_number.coordinated_alert_delay_minutes') | int(45) }}-min failsafe activated standalone. Humidity at {{ states('sensor.max_indoor_humidity_sensor') | round(1) }}%
                        (started at {{ states('input_number.coordinated_trigger_humidity') | round(1) }}%) has not cleared after {{ states('input_number.coordinated_alert_delay_minutes') | int(45) }} minutes.
                        Standalone was not already running - activating now.
                      level: warning

              # Send critical notification
              - service: notify.mobile_app_midnight
                data:
                  title: "🚨 Humidity Not Clearing"
                  message: >
                    Humidity at {{ states('sensor.max_indoor_humidity_sensor') | round(1) }}% after {{ states('input_number.coordinated_alert_delay_minutes') | int(45) }} min (started at {{ states('input_number.coordinated_trigger_humidity') | round(1) }}%).
                    {% if is_state('switch.meross_cool_switch', 'on') and is_state('humidifier.151732605035846_humidifier', 'on') %}Both AC and standalone running{% elif is_state('humidifier.151732605035846_humidifier', 'on') %}Standalone dehumidifier running{% else %}AC cooling to {{ states('input_number.coordinated_humidity_floor_temp') | int }}°F{% endif %} but not clearing effectively.
                  data:
                    push:
                      interruption-level: critical
              - service: system_log.write
                data:
                  message: "Coordinated: {{ states('input_number.coordinated_alert_delay_minutes') | int(45) }}-min alert. Humidity at {{ states('sensor.max_indoor_humidity_sensor') | round(1) }}% (started at {{ states('input_number.coordinated_trigger_humidity') | round(1) }}%). Not clearing effectively despite active dehumidification."
                  level: warning

    mode: single

  # ============================================================================
  # HUMIDITY NORMAL - Restore Previous Temperature
  # ============================================================================
  - id: coordinated_humidity_normal
    alias: "Coordinated: Humidity Normal - Restore Temperature"
    description: "Return to previous temperature when humidity drops below threshold"
    trigger:
      - platform: numeric_state
        entity_id: sensor.max_indoor_humidity_sensor
        below: input_number.coordinated_humidity_off_threshold
    condition:
      # Only trigger if in humidity control mode
      - condition: state
        entity_id: input_boolean.coordinated_humidity_active
        state: "on"
    action:
      # Mark humidity control as inactive FIRST (prevents Manual Override race condition)
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.coordinated_humidity_active
      - wait_template: "{{ is_state('input_boolean.coordinated_humidity_active', 'off') }}"
        timeout:
          seconds: 5

      # Cancel any running alert timer from Humidity High automation
      # This allows humidity control to re-trigger immediately if needed
      - service: automation.turn_off
        target:
          entity_id: automation.coordinated_humidity_high_activate_dehumidification
        data:
          stop_actions: true
      - service: automation.turn_on
        target:
          entity_id: automation.coordinated_humidity_high_activate_dehumidification

      # Turn off standalone if it was running
      - if:
          - condition: state
            entity_id: humidifier.151732605035846_humidifier
            state: "on"
        then:
          - service: humidifier.turn_off
            target:
              entity_id: humidifier.151732605035846_humidifier

      # Only restore temp if still at floor temp (no manual override)
      - if:
          - condition: template
            value_template: "{{ state_attr('climate.coordinated_thermostat', 'temperature') | float == states('input_number.coordinated_humidity_floor_temp') | float }}"
        then:
          # Check if day/night schedule should override the previous temp
          - if:
              - condition: state
                entity_id: input_boolean.coordinated_schedule_enabled
                state: "on"
            then:
              # Apply day or night temp based on current time
              - service: climate.set_temperature
                target:
                  entity_id: climate.coordinated_thermostat
                data:
                  temperature: >
                    {% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}
                    {% set now_time = now() %}
                    {% if use_sun %}
                      {% set next_rising = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                      {% set next_setting = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                      {% set today_sunrise = next_rising if next_rising.date() == now_time.date() else next_rising - timedelta(days=1) %}
                      {% set today_sunset = next_setting if next_setting.date() == now_time.date() else next_setting - timedelta(days=1) %}
                      {% set day_offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
                      {% set night_offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
                      {% set day_start = today_sunrise + timedelta(minutes=day_offset) %}
                      {% set night_start = today_sunset + timedelta(minutes=night_offset) %}
                    {% else %}
                      {% set day_start = today_at(states('input_datetime.coordinated_day_start')) %}
                      {% set night_start = today_at(states('input_datetime.coordinated_night_start')) %}
                    {% endif %}
                    {% if day_start <= now_time < night_start %}
                      {{ states('input_number.coordinated_day_temp') | float(76) }}
                    {% else %}
                      {{ states('input_number.coordinated_night_temp') | float(73) }}
                    {% endif %}
              - service: system_log.write
                data:
                  message: >
                    {% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}
                    {% set now_time = now() %}
                    {% if use_sun %}
                      {% set next_rising = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                      {% set next_setting = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                      {% set today_sunrise = next_rising if next_rising.date() == now_time.date() else next_rising - timedelta(days=1) %}
                      {% set today_sunset = next_setting if next_setting.date() == now_time.date() else next_setting - timedelta(days=1) %}
                      {% set day_offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
                      {% set night_offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
                      {% set day_start = today_sunrise + timedelta(minutes=day_offset) %}
                      {% set night_start = today_sunset + timedelta(minutes=night_offset) %}
                    {% else %}
                      {% set day_start = today_at(states('input_datetime.coordinated_day_start')) %}
                      {% set night_start = today_at(states('input_datetime.coordinated_night_start')) %}
                    {% endif %}
                    {% set is_day = day_start <= now_time < night_start %}
                    Coordinated: Humidity normal ({{ states('sensor.max_indoor_humidity_sensor') | round(0) }}%). Schedule enabled, applied {{ 'day' if is_day else 'night' }} temp {{ states('input_number.coordinated_day_temp') | int if is_day else states('input_number.coordinated_night_temp') | int }}°F.
                  level: warning
            else:
              # No schedule, restore previous temp
              - service: climate.set_temperature
                target:
                  entity_id: climate.coordinated_thermostat
                data:
                  temperature: "{{ states('input_number.coordinated_previous_temp') | float(76) }}"
              - service: system_log.write
                data:
                  message: "Coordinated: Humidity normal ({{ states('sensor.max_indoor_humidity_sensor') | round(0) }}%). Restored to {{ states('input_number.coordinated_previous_temp') | round(0) | int }}°F."
                  level: warning
        else:
          - service: system_log.write
            data:
              message: "Coordinated: Humidity normal ({{ states('sensor.max_indoor_humidity_sensor') }}%). Keeping manual settings."
              level: warning

    mode: single

  # ============================================================================
  # STANDALONE FALLBACK - AC Off But Humidity Still High
  # ============================================================================
  - id: coordinated_standalone_fallback
    alias: "Coordinated: Standalone Fallback"
    description: "Turn on standalone dehumidifier when AC can't help anymore"
    trigger:
      # AC turns off (normal case - AC reached floor temp)
      - platform: state
        entity_id: switch.meross_cool_switch
        to: "off"
        id: ac_off
      # Humidity mode activated (edge case - room already below floor temp)
      - platform: state
        entity_id: input_boolean.coordinated_humidity_active
        to: "on"
        id: humidity_activated
    condition:
      # Only if humidity control is enabled
      - condition: state
        entity_id: input_boolean.coordinated_humidity_enabled
        state: "on"
      # And humidity control is active
      - condition: state
        entity_id: input_boolean.coordinated_humidity_active
        state: "on"
      # And humidity is still above OFF threshold
      - condition: numeric_state
        entity_id: sensor.max_indoor_humidity_sensor
        above: input_number.coordinated_humidity_off_threshold
      # And temperature has actually reached floor (within configured tolerance)
      # This prevents standalone from activating when AC is off due to min_cycle_duration
      - condition: template
        value_template: >
          {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | float(999)
             <= (states('input_number.coordinated_humidity_floor_temp') | float(70) + states('input_number.coordinated_floor_temp_tolerance') | float(1.0)) }}
    action:
      - choose:
          # Path 1: AC turned off (normal case - AC reached floor temp)
          - conditions:
              - condition: trigger
                id: ac_off
            sequence:
              - service: humidifier.turn_on
                target:
                  entity_id: humidifier.151732605035846_humidifier
              - service: system_log.write
                data:
                  message: "Coordinated: Standalone on. AC cooled to {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | round(1) }}°F (floor {{ states('input_number.coordinated_humidity_floor_temp') | int }}°F) but humidity still {{ states('sensor.max_indoor_humidity_sensor') }}%."
                  level: warning

          # Path 2: Humidity mode just activated (edge case - room already at/below floor)
          - conditions:
              - condition: trigger
                id: humidity_activated
            sequence:
              # Wait for AC to potentially start
              - delay:
                  seconds: 30
              # Re-check all conditions - only proceed if AC is off AND temp is at floor
              - condition: state
                entity_id: switch.meross_cool_switch
                state: "off"
              - condition: state
                entity_id: input_boolean.coordinated_humidity_active
                state: "on"
              - condition: numeric_state
                entity_id: sensor.max_indoor_humidity_sensor
                above: input_number.coordinated_humidity_off_threshold
              - condition: template
                value_template: >
                  {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | float(999)
                     <= (states('input_number.coordinated_humidity_floor_temp') | float(70) + states('input_number.coordinated_floor_temp_tolerance') | float(1.0)) }}
              # Only activate standalone if not already running (prevents duplicate log from Humidity High automation)
              - condition: state
                entity_id: humidifier.151732605035846_humidifier
                state: "off"
              # All conditions passed - room is at floor temp but AC can't help more
              - service: humidifier.turn_on
                target:
                  entity_id: humidifier.151732605035846_humidifier
              - service: system_log.write
                data:
                  message: "Coordinated: Standalone on. Room already at {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | round(1) }}°F (floor {{ states('input_number.coordinated_humidity_floor_temp') | int }}°F) - AC can't help. Humidity at {{ states('sensor.max_indoor_humidity_sensor') }}%."
                  level: warning

    mode: single

  # ============================================================================
  # MANUAL OVERRIDE - Exit Humidity Mode
  # ============================================================================
  - id: coordinated_manual_override
    alias: "Coordinated: Manual Override - Exit Humidity Mode"
    description: "Exit humidity mode if someone manually changes temperature or turns off climate"
    trigger:
      # Thermostat temperature attribute changed
      - platform: state
        entity_id: climate.coordinated_thermostat
        attribute: temperature
      # Climate turned off
      - platform: state
        entity_id: climate.coordinated_thermostat
        to: "off"
    condition:
      # Only if in humidity control mode
      - condition: state
        entity_id: input_boolean.coordinated_humidity_active
        state: "on"
      # And temperature is no longer at floor temp (actual manual override)
      - condition: template
        value_template: "{{ state_attr('climate.coordinated_thermostat', 'temperature') | float(0) != states('input_number.coordinated_humidity_floor_temp') | float(70) }}"
    action:
      # Mark humidity control as inactive
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.coordinated_humidity_active

      # Suppress re-entry until humidity drops below threshold
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.coordinated_humidity_suppressed

      # Log the event
      - service: system_log.write
        data:
          message: "Coordinated: Manual override detected. Humidity control paused until humidity drops below {{ states('input_number.coordinated_humidity_off_threshold') | int }}%."
          level: warning

    mode: single

  # ============================================================================
  # CLEAR SUPPRESSION - Humidity Dropped
  # ============================================================================
  - id: coordinated_clear_suppression
    alias: "Coordinated: Clear Suppression"
    description: "Clear suppression when humidity drops below threshold"
    trigger:
      - platform: numeric_state
        entity_id: sensor.max_indoor_humidity_sensor
        below: input_number.coordinated_humidity_off_threshold
    condition:
      - condition: state
        entity_id: input_boolean.coordinated_humidity_suppressed
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.coordinated_humidity_suppressed

      # Turn off standalone if it was running
      - if:
          - condition: state
            entity_id: humidifier.151732605035846_humidifier
            state: "on"
        then:
          - service: humidifier.turn_off
            target:
              entity_id: humidifier.151732605035846_humidifier

      # Log the event
      - service: system_log.write
        data:
          message: "Coordinated: Suppression cleared. Humidity dropped to {{ states('sensor.max_indoor_humidity_sensor') }}%. Humidity control re-enabled."
          level: warning

    mode: single

  # ============================================================================
  # STARTUP SYNC - Fix Inconsistent State
  # ============================================================================
  - id: coordinated_startup_sync
    alias: "Coordinated: Startup Sync"
    description: "Sync state on Home Assistant startup"
    trigger:
      - platform: homeassistant
        event: start
    action:
      # Wait for entities to be available
      - wait_template: >
          {{ states('sensor.max_indoor_humidity_sensor') not in ['unavailable', 'unknown'] and
             states('input_boolean.coordinated_initialized') not in ['unavailable', 'unknown'] and
             states('input_boolean.coordinated_humidity_enabled') not in ['unavailable', 'unknown'] and
             states('input_boolean.coordinated_humidity_active') not in ['unavailable', 'unknown'] and
             states('input_boolean.coordinated_humidity_suppressed') not in ['unavailable', 'unknown'] and
             states('input_number.coordinated_humidity_off_threshold') not in ['unavailable', 'unknown'] and
             states('input_boolean.coordinated_schedule_enabled') not in ['unavailable', 'unknown'] and
             states('sun.sun') not in ['unavailable', 'unknown'] }}
        timeout:
          minutes: 5

      # First-run initialization - set all defaults
      - if:
          - condition: state
            entity_id: input_boolean.coordinated_initialized
            state: "off"
        then:
          # Set humidity control defaults
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.coordinated_humidity_enabled
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_humidity_on_threshold
            data:
              value: 49
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_humidity_off_threshold
            data:
              value: 47
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_humidity_floor_temp
            data:
              value: 70
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_previous_temp
            data:
              value: 76
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_trigger_humidity
            data:
              value: 0

          # Set schedule defaults (sun-based enabled by default)
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.coordinated_schedule_enabled
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.coordinated_use_sun
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_day_temp
            data:
              value: 76
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_night_temp
            data:
              value: 73
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_day_sun_offset
            data:
              value: 0
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_night_sun_offset
            data:
              value: -30

          # Set fixed time defaults (for when user switches to fixed times)
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.coordinated_day_start
            data:
              time: "06:00:00"
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.coordinated_night_start
            data:
              time: "21:00:00"

          # Mark as initialized
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.coordinated_initialized
          - service: system_log.write
            data:
              message: "Coordinated Startup: First run - applied default settings (sun-based scheduling enabled, -30min sunset offset)"
              level: warning

      # If humidity_active is on but humidity is below threshold, exit humidity mode
      - if:
          - condition: state
            entity_id: input_boolean.coordinated_humidity_active
            state: "on"
          - condition: numeric_state
            entity_id: sensor.max_indoor_humidity_sensor
            below: input_number.coordinated_humidity_off_threshold
        then:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.coordinated_humidity_active
          - if:
              - condition: state
                entity_id: humidifier.151732605035846_humidifier
                state: "on"
            then:
              - service: humidifier.turn_off
                target:
                  entity_id: humidifier.151732605035846_humidifier
          - service: system_log.write
            data:
              message: "Coordinated Startup: humidity_active was ON but humidity ({{ states('sensor.max_indoor_humidity_sensor') }}%) is below threshold. Turned OFF humidity_active and standalone."
              level: warning

      # If suppressed but humidity is below threshold, clear suppression
      - if:
          - condition: state
            entity_id: input_boolean.coordinated_humidity_suppressed
            state: "on"
          - condition: numeric_state
            entity_id: sensor.max_indoor_humidity_sensor
            below: input_number.coordinated_humidity_off_threshold
        then:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.coordinated_humidity_suppressed
          - service: system_log.write
            data:
              message: "Coordinated Startup: humidity_suppressed was ON but humidity ({{ states('sensor.max_indoor_humidity_sensor') }}%) is below threshold. Cleared suppression."
              level: warning

      # Handle Quick Heat + humidity control state inconsistencies
      # Case 1: Quick Heat ON + humidity_active ON = inconsistent (Quick Heat should have exited)
      - if:
          - condition: template
            value_template: "{{ states('input_boolean.coordinated_quick_heat_active') == 'on' }}"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_active
            state: "on"
        then:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.coordinated_humidity_active
          - if:
              - condition: state
                entity_id: humidifier.151732605035846_humidifier
                state: "on"
            then:
              - service: humidifier.turn_off
                target:
                  entity_id: humidifier.151732605035846_humidifier
          - service: system_log.write
            data:
              message: "Coordinated Startup: Inconsistent state detected - Quick Heat ON but humidity_active also ON. Turned OFF humidity_active (Quick Heat takes precedence)."
              level: warning

      # Case 2: Quick Heat ON + humidity HIGH + humidity_active OFF = need to activate standalone
      - if:
          - condition: template
            value_template: "{{ states('input_boolean.coordinated_quick_heat_active') == 'on' }}"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_enabled
            state: "on"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_active
            state: "off"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_suppressed
            state: "off"
          - condition: numeric_state
            entity_id: sensor.max_indoor_humidity_sensor
            above: input_number.coordinated_humidity_on_threshold
        then:
          # Activate humidity control
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.coordinated_humidity_active
          # Save timestamp for absolute alert timing
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.coordinated_humidity_start_time
            data:
              datetime: "{{ now() }}"
          # Save current temperature
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_previous_temp
            data:
              value: "{{ state_attr('climate.coordinated_thermostat', 'temperature') | float(76) | round(0) }}"
          # Save triggering humidity value
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_trigger_humidity
            data:
              value: "{{ states('sensor.max_indoor_humidity_sensor') | float(50) }}"
          # Activate standalone only (Quick Heat is on, don't use AC)
          - service: humidifier.turn_on
            target:
              entity_id: humidifier.151732605035846_humidifier
          - service: system_log.write
            data:
              message: "Coordinated Startup: Quick Heat active and humidity high ({{ states('sensor.max_indoor_humidity_sensor') }}%). Activated humidity control with standalone only (AC won't interfere)."
              level: warning

      # Restore generic thermostat target if Quick Heat is active
      - if:
          - condition: template
            value_template: "{{ states('input_boolean.coordinated_quick_heat_active') == 'on' }}"
        then:
          - service: climate.set_temperature
            target:
              entity_id: climate.coordinated_thermostat
            data:
              temperature: "{{ 80 + (2 * states('input_number.coordinated_hot_tolerance') | float(1.5)) }}"
          - service: system_log.write
            data:
              message: "Coordinated Startup: Quick Heat active. Set generic thermostat to {{ 80 + (2 * states('input_number.coordinated_hot_tolerance') | float(1.5)) | round(1) }}°F to prevent AC conflict."
              level: warning

      # Case 3: Quick Heat OFF + humidity HIGH + humidity_active OFF = activate normal humidity control
      - if:
          - condition: template
            value_template: "{{ states('input_boolean.coordinated_quick_heat_active') == 'off' }}"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_enabled
            state: "on"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_active
            state: "off"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_suppressed
            state: "off"
          - condition: numeric_state
            entity_id: sensor.max_indoor_humidity_sensor
            above: input_number.coordinated_humidity_on_threshold
        then:
          # Activate humidity control
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.coordinated_humidity_active
          # Save timestamp for absolute alert timing
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.coordinated_humidity_start_time
            data:
              datetime: "{{ now() }}"
          # Save current temperature (will be overridden below, but need to store for manual override)
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_previous_temp
            data:
              value: "{{ state_attr('climate.coordinated_thermostat', 'temperature') | float(76) | round(0) }}"
          # Save triggering humidity value
          - service: input_number.set_value
            target:
              entity_id: input_number.coordinated_trigger_humidity
            data:
              value: "{{ states('sensor.max_indoor_humidity_sensor') | float(50) }}"
          # Cool to floor temp (normal humidity control)
          - service: climate.set_temperature
            target:
              entity_id: climate.coordinated_thermostat
            data:
              temperature: "{{ states('input_number.coordinated_humidity_floor_temp') | float(70) }}"
          - service: system_log.write
            data:
              message: "Coordinated Startup: Humidity high ({{ states('sensor.max_indoor_humidity_sensor') }}%). Activated normal humidity control (AC to floor temp {{ states('input_number.coordinated_humidity_floor_temp') | int }}°F)."
              level: warning

      # Sync temperature based on schedule (if enabled and humidity control not active and Quick Heat not active)
      - if:
          - condition: state
            entity_id: input_boolean.coordinated_schedule_enabled
            state: "on"
          - condition: state
            entity_id: input_boolean.coordinated_humidity_active
            state: "off"
          - condition: template
            value_template: "{{ states('input_boolean.coordinated_quick_heat_active') == 'off' }}"
        then:
          - service: climate.set_temperature
            target:
              entity_id: climate.coordinated_thermostat
            data:
              temperature: >
                {% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}
                {% set now_time = now() %}
                {% if use_sun %}
                  {% set next_rising = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                  {% set next_setting = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                  {% set today_sunrise = next_rising if next_rising.date() == now_time.date() else next_rising - timedelta(days=1) %}
                  {% set today_sunset = next_setting if next_setting.date() == now_time.date() else next_setting - timedelta(days=1) %}
                  {% set day_offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
                  {% set night_offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
                  {% set day_start = today_sunrise + timedelta(minutes=day_offset) %}
                  {% set night_start = today_sunset + timedelta(minutes=night_offset) %}
                {% else %}
                  {% set day_start = today_at(states('input_datetime.coordinated_day_start')) %}
                  {% set night_start = today_at(states('input_datetime.coordinated_night_start')) %}
                {% endif %}
                {% if day_start <= now_time < night_start %}
                  {{ states('input_number.coordinated_day_temp') | float(76) }}
                {% else %}
                  {{ states('input_number.coordinated_night_temp') | float(73) }}
                {% endif %}
          - service: system_log.write
            data:
              message: >
                {% set use_sun = is_state('input_boolean.coordinated_use_sun', 'on') %}
                {% set now_time = now() %}
                {% if use_sun %}
                  {% set next_rising = state_attr('sun.sun', 'next_rising') | as_datetime | as_local %}
                  {% set next_setting = state_attr('sun.sun', 'next_setting') | as_datetime | as_local %}
                  {% set today_sunrise = next_rising if next_rising.date() == now_time.date() else next_rising - timedelta(days=1) %}
                  {% set today_sunset = next_setting if next_setting.date() == now_time.date() else next_setting - timedelta(days=1) %}
                  {% set day_offset = states('input_number.coordinated_day_sun_offset') | int(0) %}
                  {% set night_offset = states('input_number.coordinated_night_sun_offset') | int(0) %}
                  {% set day_start = today_sunrise + timedelta(minutes=day_offset) %}
                  {% set night_start = today_sunset + timedelta(minutes=night_offset) %}
                {% else %}
                  {% set day_start = today_at(states('input_datetime.coordinated_day_start')) %}
                  {% set night_start = today_at(states('input_datetime.coordinated_night_start')) %}
                {% endif %}
                {% set is_day = day_start <= now_time < night_start %}
                Coordinated Startup: Set temperature to {{ states('input_number.coordinated_day_temp') | int if is_day else states('input_number.coordinated_night_temp') | int }}°F ({{ 'day' if is_day else 'night' }} mode).
              level: warning

      # Log startup complete with current state
      - service: system_log.write
        data:
          message: "Coordinated Startup: Sync complete. Humidity: {{ states('sensor.max_indoor_humidity_sensor') }}%, Enabled: {{ states('input_boolean.coordinated_humidity_enabled') }}, Active: {{ states('input_boolean.coordinated_humidity_active') }}, Suppressed: {{ states('input_boolean.coordinated_humidity_suppressed') }}, Schedule: {{ states('input_boolean.coordinated_schedule_enabled') }}, Quick Heat: {{ states('input_boolean.coordinated_quick_heat_active') }}"
          level: warning

      # If humidity control is active but standalone hasn't been activated yet,
      # check if standalone should run immediately or restart alert timer
      - if:
          - condition: state
            entity_id: input_boolean.coordinated_humidity_active
            state: "on"
          - condition: state
            entity_id: humidifier.151732605035846_humidifier
            state: "off"
        then:
          # Check if AC can actually run given current temperature and generic_thermostat tolerances
          - if:
              - condition: template
                value_template: >
                  {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | float(999)
                     <= (states('input_number.coordinated_humidity_floor_temp') | float(70) + states('input_number.coordinated_hot_tolerance') | float(1.5)) }}
            then:
              # Temperature within tolerance - activate standalone immediately
              - service: humidifier.turn_on
                target:
                  entity_id: humidifier.151732605035846_humidifier
              - service: system_log.write
                data:
                  message: >
                    Coordinated Startup: Humidity control was active after restart. Standalone activated immediately. Current temp {{ state_attr('climate.coordinated_thermostat', 'current_temperature') | round(1) }}°F
                    is within hot_tolerance ({{ states('input_number.coordinated_hot_tolerance') | float(1.5) }}°F) of floor temp {{ states('input_number.coordinated_humidity_floor_temp') | int }}°F.
                    AC won't run until temp exceeds {{ (states('input_number.coordinated_humidity_floor_temp') | float(70) + states('input_number.coordinated_hot_tolerance') | float(1.5)) | round(1) }}°F.
                    Humidity at {{ states('sensor.max_indoor_humidity_sensor') }}%.
                  level: warning
            else:
              # Temperature outside tolerance - AC can run, continue waiting for alert time
              - service: system_log.write
                data:
                  message: >
                    Coordinated Startup: Humidity control active, continuing alert timer.
                    Started at {{ states('input_datetime.coordinated_humidity_start_time') }},
                    will alert at {{ (states('input_datetime.coordinated_humidity_start_time') | as_datetime | as_local + timedelta(minutes=states('input_number.coordinated_alert_delay_minutes') | int(45))).strftime('%Y-%m-%d %H:%M:%S') }}.
                  level: warning
              # Wait for absolute time (start + delay) to ensure consistent timing across HA restarts
              - wait_template: >
                  {% set start = states('input_datetime.coordinated_humidity_start_time') | as_datetime | as_local %}
                  {% set delay_min = states('input_number.coordinated_alert_delay_minutes') | int(45) %}
                  {% if start %}
                    {{ (now() - start).total_seconds() / 60 >= delay_min }}
                  {% else %}
                    false
                  {% endif %}
                timeout:
                  hours: 3
              - if:
                  - condition: state
                    entity_id: input_boolean.coordinated_humidity_active
                    state: "on"
                  - condition: template
                    value_template: >
                      {{ states('sensor.max_indoor_humidity_sensor') | float(0)
                         > (states('input_number.coordinated_trigger_humidity') | float(50) - states('input_number.coordinated_alert_humidity_drop_threshold') | float(3)) }}
                then:
                  # Activate standalone as failsafe if not already running
                  - if:
                      - condition: state
                        entity_id: humidifier.151732605035846_humidifier
                        state: "off"
                    then:
                      - service: humidifier.turn_on
                        target:
                          entity_id: humidifier.151732605035846_humidifier
                      - service: system_log.write
                        data:
                          message: >
                            Coordinated: {{ states('input_number.coordinated_alert_delay_minutes') | int(45) }}-min failsafe activated standalone (post-restart). Humidity at {{ states('sensor.max_indoor_humidity_sensor') | round(1) }}%
                            (started at {{ states('input_number.coordinated_trigger_humidity') | round(1) }}%) has not cleared after {{ states('input_number.coordinated_alert_delay_minutes') | int(45) }} minutes.
                            Standalone was not already running - activating now.
                          level: warning

                  # Send critical notification
                  - service: notify.mobile_app_midnight
                    data:
                      title: "🚨 Humidity Not Clearing"
                      message: >
                        Humidity at {{ states('sensor.max_indoor_humidity_sensor') | round(1) }}% after {{ states('input_number.coordinated_alert_delay_minutes') | int(45) }} min (started at {{ states('input_number.coordinated_trigger_humidity') | round(1) }}%).
                        {% if is_state('switch.meross_cool_switch', 'on') and is_state('humidifier.151732605035846_humidifier', 'on') %}Both AC and standalone running{% elif is_state('humidifier.151732605035846_humidifier', 'on') %}Standalone dehumidifier running{% else %}AC cooling to {{ states('input_number.coordinated_humidity_floor_temp') | int }}°F{% endif %} but not clearing effectively.
                      data:
                        push:
                          interruption-level: critical
                  - service: system_log.write
                    data:
                      message: "Coordinated: {{ states('input_number.coordinated_alert_delay_minutes') | int(45) }}-min alert (post-restart). Humidity at {{ states('sensor.max_indoor_humidity_sensor') | round(1) }}% (started at {{ states('input_number.coordinated_trigger_humidity') | round(1) }}%). Not clearing effectively despite active dehumidification."
                      level: warning
    mode: single

  # ============================================================================
  # DAY MODE - Switch to Day Temperature
  # ============================================================================
  - id: coordinated_day_mode
    alias: "Coordinated: Day Mode"
    description: "Switch to day temperature at scheduled time or sunrise"
    trigger:
      - platform: time
        at: sensor.coordinated_day_trigger_time
    condition:
      # Only if schedule is enabled
      - condition: state
        entity_id: input_boolean.coordinated_schedule_enabled
        state: "on"
      # And not in humidity control mode
      - condition: state
        entity_id: input_boolean.coordinated_humidity_active
        state: "off"
      # And Quick Heat is not active
      - condition: template
        value_template: "{{ states('input_boolean.coordinated_quick_heat_active') == 'off' }}"
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.coordinated_thermostat
        data:
          temperature: "{{ states('input_number.coordinated_day_temp') | float(76) }}"

      - service: system_log.write
        data:
          message: >
            {% if is_state('input_boolean.coordinated_use_sun', 'on') %}
              Coordinated: Day mode. Sunrise{% if states('input_number.coordinated_day_sun_offset') | int(0) != 0 %} {{ states('input_number.coordinated_day_sun_offset') | int(0) }} min{% endif %}: switched to {{ states('input_number.coordinated_day_temp') | int(76) }}°F.
            {% else %}
              Coordinated: Day mode. Switched to {{ states('input_number.coordinated_day_temp') | int(76) }}°F.
            {% endif %}
          level: warning
    mode: single

  # ============================================================================
  # NIGHT MODE - Switch to Night Temperature
  # ============================================================================
  - id: coordinated_night_mode
    alias: "Coordinated: Night Mode"
    description: "Switch to night temperature at scheduled time or sunset"
    trigger:
      - platform: time
        at: sensor.coordinated_night_trigger_time
    condition:
      # Only if schedule is enabled
      - condition: state
        entity_id: input_boolean.coordinated_schedule_enabled
        state: "on"
      # And not in humidity control mode
      - condition: state
        entity_id: input_boolean.coordinated_humidity_active
        state: "off"
      # And Quick Heat is not active
      - condition: template
        value_template: "{{ states('input_boolean.coordinated_quick_heat_active') == 'off' }}"
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.coordinated_thermostat
        data:
          temperature: "{{ states('input_number.coordinated_night_temp') | float(73) }}"

      - service: system_log.write
        data:
          message: >
            {% if is_state('input_boolean.coordinated_use_sun', 'on') %}
              Coordinated: Night mode. Sunset{% if states('input_number.coordinated_night_sun_offset') | int(0) != 0 %} {{ states('input_number.coordinated_night_sun_offset') | int(0) }} min{% endif %}: switched to {{ states('input_number.coordinated_night_temp') | int(73) }}°F.
            {% else %}
              Coordinated: Night mode. Switched to {{ states('input_number.coordinated_night_temp') | int(73) }}°F.
            {% endif %}
          level: warning
    mode: single

# ==============================================================================
# END OF PACKAGE
# ==============================================================================
