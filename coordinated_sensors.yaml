# ==============================================================================
# COORDINATED COOLER HELPER SENSORS & BOOLEANS v4.3
# ==============================================================================
#
# DESCRIPTION:
# Helper sensors and input booleans for the Coordinated Cooler Control System
# dashboard. These provide calculated values and UI state management.
#
# INSTALLATION:
# 1. Place this file in /config/packages/coordinated_sensors.yaml
# 2. Restart Home Assistant
# 3. Verify entities created in Developer Tools → States
#
# ENTITIES CREATED:
# Sensors:
#   - sensor.coordinated_timer_display (countdown timer display)
#   - sensor.coordinated_current_mode (Day/Night mode indicator)
#   - sensor.coordinated_temperature_floor (current floor temperature)
#
# Input Booleans (for collapsible dashboard sections):
#   - input_boolean.coordinated_daynight_expanded
#   - input_boolean.coordinated_humidity_expanded
#   - input_boolean.coordinated_safety_expanded
#   - input_boolean.coordinated_diagnostics_expanded
#
# ==============================================================================

# ==============================================================================
# INPUT BOOLEANS - Dashboard Section Collapse State
# ==============================================================================
input_boolean:
  coordinated_daynight_expanded:
    name: "Day/Night Configuration Expanded"
    initial: off
    icon: mdi:chevron-down
  
  coordinated_humidity_expanded:
    name: "Humidity Tuning Expanded"
    initial: off
    icon: mdi:chevron-down
  
  coordinated_safety_expanded:
    name: "Safety Settings Expanded"
    initial: off
    icon: mdi:chevron-down
  
  coordinated_diagnostics_expanded:
    name: "Diagnostics Expanded"
    initial: off
    icon: mdi:chevron-down

# ==============================================================================
# TEMPLATE SENSORS - Dashboard Display Helpers
# ==============================================================================
template:
  - sensor:
      # ==========================================================================
      # TIMER DISPLAY - Human-Readable Countdown
      # ==========================================================================
      - name: "Coordinated Timer Display"
        unique_id: coordinated_timer_display
        state: >
          {% if is_state('timer.coordinated_cooler_min_cycle', 'active') %}
            {% set remaining = state_attr('timer.coordinated_cooler_min_cycle', 'finishes_at') %}
            {% if remaining %}
              {% set finish_time = as_timestamp(remaining) %}
              {% set current_time = as_timestamp(now()) %}
              {% set seconds_left = (finish_time - current_time) | int %}
              {% set minutes = (seconds_left // 60) | int %}
              {% set seconds = (seconds_left % 60) | int %}
              {{ minutes }}m {{ seconds }}s
            {% else %}
              Active
            {% endif %}
          {% else %}
            idle
          {% endif %}
        icon: mdi:timer-sand
        availability: "{{ states('timer.coordinated_cooler_min_cycle') not in ['unknown', 'unavailable'] }}"
      
      # ==========================================================================
      # CURRENT MODE - Day or Night Mode Indicator
      # ==========================================================================
      - name: "Coordinated Current Mode"
        unique_id: coordinated_current_mode
        state: >
          {% set hour = now().hour %}
          {% set day_start = states('input_number.coordinated_day_mode_start') | int(6) %}
          {% set night_start = states('input_number.coordinated_night_mode_start') | int(21) %}
          {% if night_start > day_start %}
            {% set is_night = hour >= night_start or hour < day_start %}
          {% else %}
            {% set is_night = hour >= night_start and hour < day_start %}
          {% endif %}
          {{ 'Night' if is_night else 'Day' }}
        icon: >
          {% set hour = now().hour %}
          {% set day_start = states('input_number.coordinated_day_mode_start') | int(6) %}
          {% set night_start = states('input_number.coordinated_night_mode_start') | int(21) %}
          {% if night_start > day_start %}
            {% set is_night = hour >= night_start or hour < day_start %}
          {% else %}
            {% set is_night = hour >= night_start and hour < day_start %}
          {% endif %}
          {{ 'mdi:weather-night' if is_night else 'mdi:weather-sunny' }}
        availability: >
          {{ states('input_number.coordinated_day_mode_start') not in ['unknown', 'unavailable'] and
             states('input_number.coordinated_night_mode_start') not in ['unknown', 'unavailable'] }}
      
      # ==========================================================================
      # TEMPERATURE FLOOR - Current Calculated Floor
      # ==========================================================================
      - name: "Coordinated Temperature Floor"
        unique_id: coordinated_temperature_floor
        state: >
          {% set hour = now().hour %}
          {% set day_start = states('input_number.coordinated_day_mode_start') | int(6) %}
          {% set night_start = states('input_number.coordinated_night_mode_start') | int(21) %}
          {% if night_start > day_start %}
            {% set is_night = hour >= night_start or hour < day_start %}
          {% else %}
            {% set is_night = hour >= night_start and hour < day_start %}
          {% endif %}
          {% if is_night %}
            {% set setpoint = state_attr('climate.coordinated_indoor_thermostat', 'temperature') | float(73) %}
            {% set cutoff = setpoint - 0.5 %}
            {% set buffer = 1.5 if cutoff >= 75 else 0.5 %}
            {% set floor = cutoff - buffer + 0.2 %}
            {{ floor | round(1) }}
          {% else %}
            {{ states('input_number.coordinated_day_floor_temp') | float(70) | round(1) }}
          {% endif %}
        unit_of_measurement: "°F"
        icon: mdi:floor-plan
        availability: >
          {{ states('climate.coordinated_indoor_thermostat') not in ['unknown', 'unavailable'] and
             states('input_number.coordinated_day_floor_temp') not in ['unknown', 'unavailable'] }}

# ==============================================================================
# END OF HELPER SENSORS & BOOLEANS
# ==============================================================================
